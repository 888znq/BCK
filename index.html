<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WALLSPECTRUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0420; --surface: #140a3a; --panel: #140a3a;
    --border: #3d2fa0; --border2: #6c4cff;
    --green: #00f5a0; --red: #ff5c7a; --cyan: #00e5ff;
    --text: #ffffff; --text-dim: #a79bf0; --text-mid: #d6ceff;
    --sig-green: #00e676; --sig-red: #ff2e5b;
  --mono: 'JetBrains Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
::-webkit-scrollbar { display: none; }
html, body { background: var(--bg); }
body {
  color: var(--text); font: 16px/1.5 var(--sans);
  height: 100vh; height: 100dvh; overflow: hidden;
}
body::before {
  content: ""; position: fixed; inset: 8px; z-index: 1100;
  border: 2px solid var(--green); border-radius: 32px; pointer-events: none;
}

/* layout */
.layout {
  position: fixed; top: 8px; left: 8px; right: 8px;
  bottom: calc(8px + 9vh); bottom: calc(8px + 9dvh);
  display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr;
  background: var(--bg); border-radius: 32px 32px 0 0; overflow: hidden;
}
.main { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

/* filter bar */
.filter-bar {
  display: none; align-items: center; flex-wrap: wrap; gap: 4px;
  padding: 12px 26px 6px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.filter-bar.show { display: flex; }
.filter-bar input, .filter-bar select {
  min-width: 0; padding: 6px 4px; background: var(--panel); color: var(--text);
  border: 1px solid var(--border2); border-radius: 4px;
  font-family: var(--mono); font-size: 15px; outline: none;
}
.filter-bar input { flex: 1 1 40px; }
.filter-bar select { flex: 1 1 90px; }
.filter-bar input:focus { border-color: var(--green); }
.filter-bar :disabled { opacity: .45; pointer-events: none; }
.export-btn {
  padding: 7px 12px; background: transparent; color: var(--cyan);
  border: 1px solid var(--cyan); border-radius: 4px;
  font-family: var(--mono); font-size: 12px; letter-spacing: .08em;
  white-space: nowrap; cursor: pointer; transition: all .15s;
}
.filter-bar .export-btn { flex: 1 1 auto; padding: 7px 8px; font-size: 11px; }
.export-btn:hover { background: rgba(46,213,115,.1); box-shadow: 0 0 10px rgba(46,213,115,.3); }
.export-btn.on { background: var(--green); color: #000432; }

/* results area */
.table-area { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden auto; }
.split-table-wrap {
  flex: 1 1 0; min-height: 0; width: 100%; background: var(--bg);
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr);
}
.split-pane {
  display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%;
  overflow: hidden; background: var(--bg); border-right: 1px solid var(--bg);
}
.split-pane:first-child { border-right: 2px solid var(--border2); }
.split-pane:last-child { border-right: none; }
.pane-head {
  display: flex; justify-content: space-between; align-items: center; flex: none;
  padding: 6px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: clamp(9px, 2.6vw, 13px); color: var(--text-mid);
}
.pane-body { flex: 1 1 0; min-height: 0; overflow: hidden auto; padding-bottom: 8px; }

table {
  width: 100%; border-collapse: collapse; table-layout: fixed;
  font-family: var(--mono); font-size: clamp(8px, 2.4vw, 14px);
}
thead tr { position: sticky; top: 0; z-index: 10; background: var(--panel); }
th, td { text-align: left; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
th {
  padding: 6px 2px 6px 4px; font-size: clamp(7px, 2vw, 12px); font-weight: 500;
  text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--border);
}
tbody tr { border-bottom: 1px solid var(--border); }
.split-pane td { padding: 6px 2px 6px 4px; height: 30px; vertical-align: middle; }
.split-pane th { vertical-align: middle; }
.split-pane th:first-child, .split-pane td:first-child { padding-left: 14px; }
.split-pane th:nth-child(5), .split-pane td:nth-child(5) { text-align: right; padding-right: 12px; }
.split-pane th:nth-child(6), .split-pane td:nth-child(6) { text-align: center; }
.split-pane th:nth-child(7), .split-pane td:nth-child(7) { text-align: right; padding-right: 14px; }
.cell-pair { letter-spacing: .03em; }
.sort-th { cursor: pointer; color: var(--green); }
.row-red { color: var(--sig-red); }
.row-green { color: var(--sig-green); }
.row-red:hover { background: rgba(230,57,70,.08); border-left: 2px solid var(--sig-red); }
.row-green:hover { background: rgba(46,213,115,.08); border-left: 2px solid var(--sig-green); }

.lvl-hdr { cursor: pointer; background: var(--panel); border-bottom: 1px solid var(--border2); }
.split-pane .lvl-hdr td { padding: 5px 14px; color: var(--green); font-size: 12px; font-weight: 700; }
.lvl-hdr div { display: flex; align-items: center; justify-content: space-between; }
.lvl-tog { padding: 1px 8px; border: 1px solid var(--border2); border-radius: 3px; font-size: 10px; color: var(--text); }

.state-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 300px; gap: 14px; color: var(--text-dim);
  font-family: var(--mono); font-size: 14px; text-align: center;
}
.table-area > .state-empty { flex: 1 1 auto; }
.split-pane .state-empty {
  flex-direction: row; align-items: flex-start; justify-content: flex-start;
  min-height: 0; padding: 10px 4px; gap: 8px; font-size: 11px; text-align: left;
}

/* session ranking + cross-session view */
.rank-wrap { flex: none; margin-bottom: 6px; }
.rank-cards { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 2px; }
.rank-card { flex: 0 0 auto; min-width: 96px; padding: 5px 8px; border: 1px solid var(--border2); border-radius: 5px; text-align: center; }
.rank-card.top { border-color: var(--green); }
.rk-lbl { font-size: 10px; color: var(--text-dim); }
.rk-time, .rk-sub { font-size: 9px; color: var(--text-dim); }
.rk-val { font-size: 14px; font-weight: 700; }
.rank-card.top .rk-val { color: var(--green); }

.xs-wrap { flex: none; width: 100%; }
.xs-pane { border-bottom: 2px solid var(--border2); }
.xs-pane .state-empty { min-height: 80px; font-size: 12px; }
.xs-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: 13px; letter-spacing: .04em; color: var(--text-mid);
}
.xs-t th { padding: 6px 3px; font-size: clamp(9px, 2.6vw, 12px); }
.xs-t td { padding: 5px 3px; font-size: clamp(11px, 3.2vw, 15px); }
.xs-t tr.xs-m { border-bottom: 0; }
.xs-t tr.xs-d td {
  padding: 0 3px 7px; font-size: clamp(9px, 2.6vw, 12px);
  white-space: normal; word-break: break-word; opacity: .85;
}
.xs-t td.xs-hits { font-weight: 700; }

/* bottom settings bar */
#settingsOverlay {
  position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 900; display: flex;
  height: 9vh; height: 9dvh; overflow: hidden; background: var(--bg);
  border-top: 1px solid var(--border2); border-radius: 0 0 32px 32px;
}
#settingsOverlay.scanning { top: 8px; height: auto; z-index: 960; border-top: 0; border-radius: 32px; }
#settingsOverlay.scanning .bar { display: none; }
.bar {
  flex: 1; min-width: 0; min-height: 0; display: grid; overflow: hidden;
  grid-template-columns: 1.4fr 3fr 3.4fr 1.6fr 1.2fr 1.2fr 1.4fr;
  grid-template-rows: 1fr 1fr; background: var(--bg); border-radius: 0 0 30px 30px;
}
.bar button {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 0; min-height: 0; padding: 0; border: 0; border-right: 1px solid rgba(0,4,50,.3); border-radius: 0;
  color: #000432; -webkit-text-fill-color: #000432; font-family: var(--mono);
  cursor: pointer; touch-action: manipulation;
}
.bar button:hover { filter: brightness(1.15); }
option, optgroup { background: #140a3a !important; color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; }
.bar b { max-width: 100%; font-size: clamp(10px, min(2.4vw, 2.6vh), 22px); font-weight: 500; line-height: 1; }
.b-pair { grid-area: 1/1/3/2; padding-left: 14px !important; background: #ffd60a; }
.b-pair b { font-size: clamp(10px, min(2.2vw, 2.8vh), 20px); white-space: normal; word-break: break-all; text-align: center; }
.b-date { grid-area: 1/2/3/3; background: #ff9500; }
.b-date b { font-size: clamp(11px, 3.4vw, 20px); white-space: nowrap; }
.b-mon { grid-area: 1/3/3/4; background: #54A0FF; }
.b-mon b { font-size: clamp(7px, 2.6vw, 14px); white-space: nowrap; overflow: hidden; }
.b-yr { grid-area: 1/4/3/5; background: #A29BFE; }
.b-fh { grid-area: 1/5; background: #FF9FF3; border-bottom: 1px solid rgba(0,4,50,.3) !important; }
.b-fm { grid-area: 1/6; background: #48DBFB; border-bottom: 1px solid rgba(0,4,50,.3) !important; }
.b-th { grid-area: 2/5; background: #FF9FF3; }
.b-tm { grid-area: 2/6; background: #48DBFB; }
.b-fh::before, .b-th::before {
  position: absolute; top: 1px; left: 3px; font-size: 7px; letter-spacing: .06em; opacity: .7;
}
.b-fh::before { content: "START"; }
.b-th::before { content: "END"; }
.b-sess { grid-area: 1/3/3/4; background: #3ddcf5; }
.b-slice { grid-area: 1/4/3/5; background: #6ea8ff; }
.b-slice b { font-size: clamp(9px, 1.8vw, 18px); white-space: nowrap; line-height: 1.2; text-align: center; }
.b-sess b { font-size: clamp(9px, 1.8vw, 18px); white-space: nowrap; line-height: 1.2; text-align: center; }
.b-cmin { grid-area: 1/5; background: #e3b8ff; border-bottom: 1px solid rgba(0,4,50,.3) !important; }
.b-cmax { grid-area: 2/5; background: #c48bff; }
.b-prob { grid-area: 1/9/3/10; background: #FECA57; }
.b-cache { grid-area: 1/6/3/7; background: #ff5c7a; }
#dbD { background: #ffc266 !important; }
#dbM { background: #ffad33 !important; }
#dbY { background: #ff9500 !important; }
#bWin { background: #3ddcf5 !important; }
#bSize { background: #67c8ff !important; }
.bar select:hover { filter: brightness(1.1); }
.b-cache b { font-size: clamp(9px, 1.8vw, 18px); line-height: 1.2; text-align: center; }
.b-sim { grid-area: 1/11/3/12; background: #FFEAA7; }
.b-sim b { font-size: clamp(9px, 1.8vw, 18px); }
.b-run { grid-area: 1/7/3/8; padding-right: 14px !important; background: #00f5a0; border-right: 0 !important; }

/* scan view */
#scanPage { display: none; flex-direction: column; width: 100%; height: 100%; padding: 14px 12px; }
#settingsOverlay.scanning #scanPage { display: flex; }
.scan-title { flex: none; margin-bottom: 6px; font-family: var(--mono); font-size: 16px; letter-spacing: .12em; color: var(--green); }
.progress-head { display: flex; justify-content: space-between; margin-bottom: 8px; font-family: var(--mono); font-size: 15px; }
#progressLabel { color: var(--text-mid); }
#progressPct { color: var(--green); }
.progress-track { flex: none; height: 8px; border-radius: 2px; overflow: hidden; }
#progressFill { width: 0; height: 100%; background: var(--green); border-radius: 2px; transition: width .3s ease; }
#scanLog {
  flex: 1 1 0; min-height: 0; margin-top: 8px; padding: 8px 10px; overflow-y: auto;
  border: 1px solid var(--border2); border-radius: 4px;
  font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--text-mid);
}
#scanLog div { padding: 1px 0; border-bottom: 1px solid rgba(255,255,255,.05); word-break: break-word; }
#scanLog div:first-child { color: var(--green); }
.cancel-btn {
  flex: none; width: 100%; margin-top: 10px; padding: 14px 16px; background: transparent; color: var(--text-mid);
  border: 1px solid var(--border2); border-radius: 4px; font-family: var(--mono); font-size: 14px;
  letter-spacing: .05em; cursor: pointer;
}
.cancel-btn:hover { background: rgba(255,255,255,.08); }

/* popups */
#pop {
  display: none; position: fixed; inset: 0; z-index: 1200; padding: 10px;
    align-items: center; justify-content: center; background: rgba(8,2,30,.82);
}
.pop-box {
  width: min(560px, 96vw); max-height: 96vh; overflow-y: auto; padding: 12px;
  background: var(--surface); border: 1px solid var(--border2); border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.pop-title { margin-bottom: 10px; text-align: center; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--green); }
.pop-grid { display: grid; gap: 6px; }
.pop-grid.ph { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.pop-grid.pm { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.pop-grid.pd { grid-template-columns: repeat(7, minmax(0, 1fr)); }
.pop-grid.pmo, .pop-grid.pk { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pop-grid.py, .pop-grid.pp { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pop-grid.pss { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pop-btn {
  height: 48px; padding: 0; background: transparent; color: var(--text-mid);
  border: 1px solid var(--border2); border-radius: 6px;
  font-family: var(--mono); font-size: 17px; cursor: pointer; touch-action: manipulation;
}
.pm .pop-btn { height: 40px; font-size: 14px; }
.pmo .pop-btn { font-size: 13px; letter-spacing: 0; white-space: nowrap; overflow: hidden; }
.pp .pop-btn { height: 40px; font-size: 12px; }
.pss .pop-btn { height: auto; min-height: 58px; padding: 4px 2px; font-size: 14px; line-height: 1.15; }
.pop-btn:hover { border-color: var(--green); color: var(--text); }
.pop-btn.on, .pop-btn.ok { background: var(--green); border-color: var(--green); color: #000432; font-weight: 700; }
.pop-btn.dim { opacity: .28; cursor: not-allowed; }
.pop-sub { display: block; font-size: 10px; font-weight: 400; line-height: 1.3; }
.pop-dow { text-align: center; font-family: var(--mono); font-size: 12px; font-weight: 700; line-height: 24px; color: var(--text-dim); }
.pop-dow.we { color: #e58f99; }
.pop-display {
  margin-bottom: 10px; padding: 8px; text-align: center; color: var(--green);
  border: 1px solid var(--border2); border-radius: 6px; font-family: var(--mono); font-size: 36px;
}
.pop-display.small { padding: 6px; font-size: 12px; }

/* toast */
#toast {
  position: fixed; right: 24px; bottom: calc(9vh + 24px); bottom: calc(9dvh + 24px); z-index: 999;
  max-width: 340px; padding: 12px 18px; background: var(--panel); color: var(--text);
  border: 1px solid var(--border2); border-radius: 6px; font-family: var(--mono); font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
#toast.show { opacity: 1; }
#toast.err { border-color: var(--red); color: var(--red); }
#toast.ok { border-color: var(--green); color: var(--green); }

/* trade simulation */
#simPop {
  display: none; position: fixed; inset: 0; z-index: 1250; padding: 10px;
    align-items: center; justify-content: center; background: rgba(8,2,30,.82);
}
#simPop.show { display: flex; }
.sim-box {
  width: min(640px, 96vw); max-height: 96vh; overflow-y: auto; padding: 12px;
  background: var(--surface); border: 1px solid var(--border2); border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6); font-family: var(--mono);
}
.sim-in { display: flex; gap: 8px; margin-bottom: 10px; }
.sim-in label { flex: 1; font-size: 11px; letter-spacing: .08em; color: var(--text-dim); }
.sim-in input {
  display: block; width: 100%; margin-top: 4px; padding: 8px; background: var(--panel); color: var(--text);
  border: 1px solid var(--border2); border-radius: 4px; font-family: var(--mono); font-size: 18px; outline: none;
}
.sim-in input:focus { border-color: var(--green); }
.sim-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 8px 0 10px; }
.sim-sum > div { padding: 6px; border: 1px solid var(--border2); border-radius: 5px; text-align: center; }
.sim-sum span { display: block; font-size: 10px; color: var(--text-dim); }
.sim-sum b { font-size: 16px; font-weight: 700; }
.sim-t td, .sim-t th { padding: 6px 4px; height: auto; white-space: normal; }
.sim-t { font-size: 13px; }
.sim-pos { color: var(--sig-green); }
.sim-neg { color: var(--sig-red); }
.sim-msg { padding: 24px 8px; text-align: center; color: var(--text-dim); font-size: 13px; }
</style>
</head>
<body>

<div class="layout">
  <div class="main">
    <div class="filter-bar" id="filterBar">
      <input type="number" id="filterPct" placeholder="100" min="0" max="100">
      <select id="levelFilter">
        <option value="__ALL__" selected>ALL LEVELS</option>
        <option value="1-2">X1→X2</option>
        <option value="2-3">X2→X3</option>
        <option value="3-4">X3→X4</option>
        <option value="4-5">X4→X5</option>
        <option value="5-6">X5→X6</option>
        <option value="6-7">X6→X7</option>
        <option value="7-8">X7→X8</option>
        <option value="8-9">X8→X9</option>
        <option value="9-10">X9→X10</option>
      </select>
      <button type="button" class="export-btn" id="row0Btn" onclick="toggleRow0()">ROW 0 ONLY</button>
      <button type="button" class="export-btn on" id="lvlsBtn" onclick="toggleLvls()" title="Best % row of every level at once">LVLS</button>
      <button type="button" class="export-btn on" id="ordBtn" onclick="toggleOrd()" title="With LVLS: list levels in order X1, X2, X3...">ORD</button>
      <button type="button" class="export-btn" id="xsBtn" onclick="toggleXs()" style="display:none">BY SESSION</button>
    </div>
    <div class="table-area" id="tableArea"></div>
  </div>
</div>

<div id="settingsOverlay">
  <div class="bar" id="bar"></div>
  <div id="scanPage">
    <div class="scan-title">SCANNING…</div>
    <div class="progress-head"><span id="progressLabel">Initialising…</span><span id="progressPct">0%</span></div>
    <div class="progress-track"><div id="progressFill"></div></div>
    <div id="scanLog"></div>
    <button type="button" class="cancel-btn" id="scanCancelBtn">■ CANCEL SCAN</button>
  </div>
</div>

<div id="pop"></div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const pad2 = n => (n < 10 ? "0" : "") + n;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hm = t => { const q = ((t % 1440) + 1440) % 1440; return pad2(Math.floor(q / 60)) + ":" + pad2(q % 60); };
const fmtSess = m => m < 60 ? m + "m" : Math.floor(m / 60) + "h" + (m % 60 ? (m % 60) + "m" : "");

const WS_URL = "wss://api.derivws.com/trading/v1/options/ws/public?app_id=1089";
const IST_OFFSET = 19800;
const MONTHS = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const PAIR_GROUPS = [
  ["METALS", ["frxXAGUSD", "frxXAUUSD", "frxXPTUSD"]],
  ["FOREX", [
      "frxAUDCAD", "frxAUDCHF", "frxAUDJPY", "frxAUDNZD", "frxAUDUSD",
      "frxEURAUD", "frxEURCAD", "frxEURCHF", "frxEURGBP", "frxEURJPY", "frxEURNZD", "frxEURUSD",
      "frxGBPAUD", "frxGBPCAD", "frxGBPCHF", "frxGBPJPY", "frxGBPNZD", "frxGBPUSD",
      "frxNZDJPY", "frxNZDUSD",
      "frxUSDCAD", "frxUSDCHF", "frxUSDJPY", "frxUSDMXN"
          ]],
  ["CRYPTO", ["cryBTCUSD", "cryETHUSD"]],
    ["VOLATILITY (1s)", ["1HZ10V", "1HZ15V", "1HZ25V", "1HZ30V", "1HZ50V", "1HZ75V", "1HZ90V", "1HZ100V"]]
  ];
const ALL_PAIRS = PAIR_GROUPS.flatMap(g => g[1]);

function pairLabel(v) {
  const cd = v.replace(/^frx|^cry/, ""), m = cd.match(/^1HZ(\d+)V$/);
  return m ? "V" + m[1] : cd.slice(0, 3) + "/" + cd.slice(3);
}
function pairName(p) {
  const m = p.match(/^1HZ(\d+)V$/);
  return m ? "VOL " + m[1] : p.replace(/^(frx|cry)/, "");
}

// ── state ──
const cfg = { date: new Date().toISOString().slice(0, 10), from: "11:30", to: "23:30", cmin: 60, cmax: 60, minPct: 0, sess: 0, dayShift: 0 };
let selPairs = new Set(["cryBTCUSD"]);
let allPairsMode = false;

// ── tick cache (IndexedDB) ──
const IDB_NAME = "wallspectrum_cache", IDB_STORE = "ticks";
let idbReady = null;

function idbOpen() {
  idbReady ||= new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }).catch(err => { console.warn("IndexedDB unavailable, using memory cache only", err); return null; });
  return idbReady;
}
async function idbTx(mode, fn) {
  const db = await idbOpen();
  if (!db) return;
  return new Promise(resolve => {
    try {
      const tx = db.transaction(IDB_STORE, mode);
      fn(tx.objectStore(IDB_STORE));
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    } catch { resolve(); }
  });
}
const idbSet = (k, v) => idbTx("readwrite", s => s.put(v, k));
const idbClear = () => idbTx("readwrite", s => s.clear());
async function idbGetAll() {
  const out = {};
  await idbTx("readonly", s => {
    s.openCursor().onsuccess = e => {
      const c = e.target.result;
      if (c) { out[c.key] = c.value; c.continue(); }
    };
  });
  return out;
}
async function clearPersistedCache() {
  for (const k in tickCache) delete tickCache[k];
  await idbClear();
  toast("Cache cleared", "ok");
}

// ── tick fetching ──
function fetchChunk(pair, t0, t1) {
  return new Promise(resolve => {
    const result = {};
    let ws;
    const done = () => { clearTimeout(timer); try { ws.close(); } catch {} resolve(result); };
    const timer = setTimeout(done, 25000);
    try {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => ws.send(JSON.stringify({ ticks_history: pair, start: t0, end: t1, count: 5000, style: "ticks" }));
      ws.onmessage = ev => {
        const d = JSON.parse(ev.data);
        if (d.history) for (let i = 0; i < d.history.times.length; i++) result[+d.history.times[i]] = +d.history.prices[i];
        if (d.history || d.error) done();
      };
      ws.onerror = ws.onclose = done;
    } catch { done(); }
  });
}

async function loadTicksForDay(pair, dayEpoch, secFrom, secTo, cached, logCb) {
  const start = dayEpoch + secFrom, end = dayEpoch + secTo;
  const actualEnd = Math.min(end, Math.floor(Date.now() / 1000));
  if (actualEnd < start) return [];

  const length = end - start + 1;
  const prices = new Float64Array(length).fill(-1);
  if (cached) for (let i = 0, n = Math.min(length, cached.length); i < n; i++) prices[i] = cached[i];

  const gapMin = /^(cry|1HZ)/i.test(pair) ? 120 : 900;
  const gaps = [];
  let gapStart = -1;
  for (let i = 0; i <= actualEnd - start; i++) {
    if (prices[i] === -1) {
      if (gapStart === -1) gapStart = start + i;
    } else if (gapStart !== -1) {
      if (start + i - 1 - gapStart >= gapMin) gaps.push([gapStart, start + i - 1]);
      gapStart = -1;
    }
  }
  if (gapStart !== -1) gaps.push([gapStart, actualEnd]);

  const chunks = [];
  for (const [a, b] of gaps) for (let s = a; s <= b; s += 901) chunks.push([s, Math.min(s + 900, b)]);

  const WORKERS = 16;
  for (let i = 0; i < chunks.length; i += WORKERS) {
    if (cancelFlag) return null;
    const batch = chunks.slice(i, i + WORKERS);
    logCb(`gaps: chunks ${i + 1}–${Math.min(i + WORKERS, chunks.length)}/${chunks.length}`);
    const results = await Promise.all(batch.map(async (c, idx) => {
      let map = {}, retries = 0, delay = idx * 600;
      while (retries <= 3) {
        if (delay) await sleep(delay);
        map = await fetchChunk(pair, c[0], c[1]);
        if (Object.keys(map).length > 0) break;
        retries++;
        delay = 2000 * retries;
      }
      return map;
    }));
    for (const res of results) {
      for (const ts in res) {
        const idx = +ts - start;
        if (idx >= 0 && idx < length) prices[idx] = res[ts];
      }
    }
    await sleep(1300);
      }
      return Array.from(prices);
    }
    
    const PRE_ROLL_SECS = 900;
    async function loadPreRoll(pair, startTs) {
      const arr = new Float64Array(PRE_ROLL_SECS).fill(-1);
      const t0 = startTs - PRE_ROLL_SECS, t1 = startTs - 1;
      if (t0 >= Math.floor(Date.now() / 1000)) return Array.from(arr);
      let map = {};
      for (let tr = 0; tr < 4 && !cancelFlag; tr++) {
        map = await fetchChunk(pair, t0, t1);
        if (Object.keys(map).length > 0) break;
        await sleep(1500);
      }
      for (const ts in map) {
        const j = +ts - t0;
        if (j >= 0 && j < PRE_ROLL_SECS) arr[j] = map[ts];
      }
      return Array.from(arr);
    }

// ── streak scan (web workers) ──
function workerMain() {
  function cumulative(hist, maxS) {
    let cum = 0;
    const res = {};
    for (let i = maxS; i >= 1; i--) {
      if (hist[i]) cum += hist[i];
      if (cum > 0) res[i] = cum;
    }
    return res;
  }
  self.onmessage = e => {
    const { prices, minC, maxC, pair, startTsUtc, pre } = e.data;
        const preLen = pre ? pre.length : 0;
        const n = prices.length, revs = [], moms = [];
    for (let c = minC; c <= maxC; c++) {
      const rowColor = new Int8Array(c), rowStreak = new Int16Array(c), rowCol = new Int32Array(c).fill(-2);
      const maxLen = [new Int16Array(c), new Int16Array(c)];            // [green, red]
      const hist = [new Array(c).fill(null), new Array(c).fill(null)];
      const record = (row, color, s) => {
        const k = color === 1 ? 0 : 1;
        const h = hist[k][row] ||= {};
        h[s] = (h[s] || 0) + 1;
        if (s > maxLen[k][row]) maxLen[k][row] = s;
      };

      for (let i = 0; i < n; i++) {
        const total = startTsUtc + i, p = prices[i];
                let prevP = -1;
                if (i >= c) prevP = prices[i - c];
                else if (preLen) { const pk = preLen + i - c; if (pk >= 0) prevP = pre[pk]; }
        const col = Math.floor(total / c), row = total % c;
        const cont = rowCol[row] === col - 1;
        let newC, newS;
        if (prevP === -1) newC = newS = (p === -1 || i < c) ? 0 : 1;
        else if (p === -1) newC = newS = 0;
        else if (p > prevP) { newC = 1; newS = cont && rowColor[row] === 1 && rowStreak[row] > 0 ? rowStreak[row] + 1 : 1; }
        else if (p < prevP) { newC = 2; newS = cont && rowColor[row] === 2 && rowStreak[row] > 0 ? rowStreak[row] + 1 : 1; }
        else { newC = rowColor[row]; newS = 0; }

        if (newS === 1 && rowStreak[row] > 0 && rowColor[row] !== 0 && cont) record(row, rowColor[row], rowStreak[row], !(prevP !== -1 && newC === 3 - rowColor[row]));
        rowColor[row] = newC; rowStreak[row] = newS; rowCol[row] = col;
      }
      for (let r = 0; r < c; r++) if (rowStreak[r] >= 1 && rowColor[r] !== 0) record(r, rowColor[r], rowStreak[r]);

      for (let r = 0; r < c; r++) {
        for (let k = 0; k < 2; k++) {
          const raw = hist[k][r], maxS = maxLen[k][r];
          if (!raw || !maxS) continue;
          const col = k ? "R" : "G", cum = cumulative(raw, maxS);
          for (const key in cum) {
            const s = +key, c1 = cum[s], c2 = cum[s + 1] || 0;
            if (s < 1) continue;
            const base = { pair, c, r, s1: s, s2: s + 1, c1, c2, col };
            revs.push({ ...base, pct: 100 - Math.round(c2 / c1 * 100), type: "REV" });
            moms.push({ ...base, pct: Math.round(c2 / c1 * 100), type: "MOM" });
          }
        }
      }
    }
    self.postMessage({ revs, moms });
  };
}

let workerURL = null;
const getWorkerURL = () => workerURL ||= URL.createObjectURL(new Blob([`(${workerMain})()`], { type: "application/javascript" }));

function workerScan(prices, minC, maxC, pair, startTsUtc, onProgress, pre) {
  return new Promise(resolve => {
    const total = maxC - minC + 1;
    const nWorkers = Math.min(navigator.hardwareConcurrency || 4, 16, total);
    const per = Math.ceil(total / nWorkers);
    const shards = [];
    for (let s = minC; s <= maxC; s += per) shards.push([s, Math.min(s + per - 1, maxC)]);
    const revs = [], moms = [];
    let done = 0;
    const finish = () => {
      done++;
      if (onProgress) onProgress(done / shards.length);
      if (done === shards.length) resolve([revs, moms]);
    };
    for (const [a, b] of shards) {
      const w = new Worker(getWorkerURL());
      const buf = new Float64Array(prices);
      w.onmessage = e => {
        for (const x of e.data.revs) revs.push(x);
        for (const x of e.data.moms) moms.push(x);
        w.terminate();
        finish();
      };
      w.onerror = () => { w.terminate(); finish(); };
      const pbuf = pre ? Float64Array.from(pre) : null;
            w.postMessage({ prices: buf, minC: a, maxC: b, pair, startTsUtc, pre: pbuf }, [buf.buffer]);
    }
  });
}

async function workerScanSessions(prices, cMin, cMax, pair, startTs, winSec, sessMin, onFrac, pre0) {
  const PR = PRE_ROLL_SECS;
  const ext = new Float64Array(PR + prices.length).fill(-1);
  if (pre0 && pre0.length) ext.set(pre0.length > PR ? pre0.slice(pre0.length - PR) : pre0, PR - Math.min(pre0.length, PR));
  ext.set(prices, PR);
  if (!sessMin) return workerScan(prices, cMin, cMax, pair, startTs, onFrac, ext.subarray(0, PR));
  const n = Math.max(1, Math.round(winSec / (sessMin * 60)));
  const sessSec = Math.round(winSec / n);
  let merged = null;
  for (let si = 0; si < n; si++) {
    if (cancelFlag) break;
    const a = si * sessSec, b = si === n - 1 ? prices.length : (si + 1) * sessSec + 1;
        const slice = prices.slice(a, b);
        if (slice.length <= cMax) continue;
        const r = await workerScan(slice, cMin, cMax, pair, startTs + a, f => onFrac && onFrac((si + f) / n), ext.subarray(a, a + PR));
    for (const list of r) for (const it of list) it.sess = si + 1;
    merged = merged ? [merged[0].concat(r[0]), merged[1].concat(r[1])] : r;
  }
  return merged || [[], []];
}

function startScan() {
  if (scanRunning) { setScanView(true); return; }
  if (!cacheReady) { toast("Cache still loading, try again in a moment", "err"); return; }
  runScan();
  if (scanRunning) setScanView(true);
}

async function runScan() {
  if (scanRunning) { cancelFlag = true; return; }

  const pairs = allPairsMode ? ALL_PAIRS : (selPairs.size ? ALL_PAIRS.filter(p => selPairs.has(p)) : ["cryBTCUSD"]);
  const cycleMin = Math.max(1, cfg.cmin || 120);
  const cycleMax = Math.max(cycleMin, cfg.cmax || 180);
  const minPct = 0;

  // inputs are IST (UTC+5:30); convert to seconds from UTC midnight
  const [fH, fM] = cfg.from.split(":").map(Number), [tH, tM] = cfg.to.split(":").map(Number);
  const istFrom = fH * 3600 + fM * 60, istTo = tH * 3600 + tM * 60;
  let secFrom, secTo;
  if (istFrom === istTo) {
    secFrom = 0; secTo = 86400;
  } else {
    secFrom = ((istFrom - IST_OFFSET) % 86400 + 86400) % 86400;
    secTo = ((istTo - IST_OFFSET) % 86400 + 86400) % 86400 || 86400;
  }
  if (secTo <= secFrom) { toast("Time window must stay inside 05:30 → 05:30 IST (end after start)", "err"); return; }

  let winSec = secTo - secFrom;
  let sessMin = cfg.sess;
  if (sessMin && (winSec % (sessMin * 60) !== 0 || sessMin * 60 >= winSec)) sessMin = cfg.sess = 0;
  if (sessMin && sessMin * 60 <= cycleMax) { toast(`Session ${sessMin}m must be longer than cycle max C${cycleMax}`, "err"); return; }

  const fullCount = sessMin ? Math.round(winSec / (sessMin * 60)) : 1;
    let sliceNo = 0;
    if (sessMin && sessSel && sessSel <= fullCount) {
      sliceNo = sessSel;
      secFrom += (sessSel - 1) * sessMin * 60;
      secTo = secFrom + sessMin * 60;
      winSec = sessMin * 60;
    }
    last = { sessCount: fullCount, sessMin, startIST: cfg.from, winSec, sliceNo };
    simData = {};
  xsView = last.sessCount > 1;
  $("xsBtn").style.display = xsView ? "inline-block" : "none";
  $("xsBtn").classList.toggle("on", xsView);

  scanRunning = true;
  cancelFlag = false;
  $("filterBar").classList.remove("show");
  $("tableArea").innerHTML = "";
  $("scanLog").innerHTML = "";
  lastLog = "";
  allRevs = []; allMoms = [];

    const dayEpoch = Math.floor(new Date(cfg.date + "T00:00:00Z").getTime() / 1000) + shiftDays * 86400;
        const startTsUtc = dayEpoch + secFrom;
        const n = pairs.length;
        var skippedRef = [];

    for (let pi = 0; pi < n && !cancelFlag; pi++) {
      const pair = pairs[pi], tag = `[${pi + 1}/${n}] ${pair}`;
      const fetchBase = pi / n * 60, scanBase = 60 + pi / n * 28, scanSlice = 28 / n;
      const key = `${pair}|${cfg.date}|${secFrom}-${secTo}` + (shiftDays ? "|d" + shiftDays : "");

      setProgress(fetchBase, `${tag}  syncing day`, `${pair}  ${cfg.from}–${cfg.to} IST`);
      const prices = await loadTicksForDay(pair, dayEpoch, secFrom, secTo, tickCache[key], msg => setLog(`${tag}  ${cfg.date}  ${msg}`));
      if (cancelFlag || !prices) continue;

            idbSet(key, prices);
            const pkey = key + "|pre";
            let pre = tickCache[pkey];
            if (!pre) {
              setProgress(scanBase, `${tag}  loading pre-session reference…`);
              pre = await loadPreRoll(pair, startTsUtc);
              if (cancelFlag) continue;
              if (pre.some(v => v !== -1)) { tickCache[pkey] = pre; idbSet(pkey, pre); }
            }
            var refN = pre.slice(-Math.min(cycleMax, PRE_ROLL_SECS)).filter(v => v !== -1).length;
                        setLog(`${tag}  reference ticks: ${refN}`);
                        if (refN < 1) {
                          skippedRef.push(pairName(pair));
                          setLog(`${tag}  NO REFERENCE - skipped`);
                          continue;
                        }
                        simData[pair] = { prices, pre, startTsUtc };

      setProgress(scanBase, `${tag}  scanning (${cfg.date})…`, `Cycles C${cycleMin}–C${cycleMax}`);
      const [revs, moms] = await workerScanSessions(prices, cycleMin, cycleMax, pair, startTsUtc, winSec, sessMin, f =>
        setProgress(scanBase + f * scanSlice,
          `${tag}  ${cfg.date}  scanning… ${Math.round(f * 100)}%`,
          `C${cycleMin}–C${cycleMax}  [${navigator.hardwareConcurrency || 4} workers]`), pre);
      if (sliceNo) { revs.forEach(x => { x.sess = sliceNo; }); moms.forEach(x => { x.sess = sliceNo; }); }

    const nRev = allRevs.filter(x => x.pct >= minPct).length;
    const nMom = allMoms.filter(x => x.pct >= minPct).length;
    setProgress(100, "Complete", `Done — ${nRev} REV  |  ${nMom} MOM`);
    $("filterBar").classList.remove("show");
    $("filterPct").value = minPct;
    renderTable();
    if (skippedRef.length) toast(`Skipped (no reference): ${skippedRef.join(", ")} — ${nRev + nMom} signals`, "err", 7000);
        else toast(`Scan complete — ${nRev + nMom} signals`, "ok");
  } finally {
    scanRunning = false;
    cancelFlag = false;
    setScanView(false);
  }
}

function buildSessionRankHTML(filterFn) {
  const cnt = last.sessCount;
  if (cnt < 2) return "";
  const agg = {};
  for (const d of allRevs.concat(allMoms)) {
    if (!filterFn(d)) continue;
    const s = d.sess || 1;
    const a = agg[s] ||= { s, n: 0, sumP: 0, sumW: 0, sumC: 0 };
    a.n++; a.sumP += d.pct; a.sumW += d.pct * d.c1; a.sumC += d.c1;
  }
  const list = Object.values(agg)
    .map(g => ({ ...g, win: g.sumC ? g.sumW / g.sumC : 0, avg: g.sumP / g.n }))
    .sort((x, y) => y.win - x.win || y.n - x.n);
  if (!list.length) return "";

  const sessTime = s => {
    if (!last.startIST || !last.sessMin) return "";
    const [h, m] = last.startIST.split(":").map(Number);
    const t0 = h * 60 + m + (s - 1) * last.sessMin;
    return hm(t0) + "-" + hm(t0 + last.sessMin);
  };
  const cards = list.map((g, idx) => {
    const tl = sessTime(g.s);

  }).join("");

      `<div style="display:flex;flex-wrap:wrap;gap:6px;padding:6px 2px">${sel}</div>` +
      `<div class="rank-cards">${cards}</div></div>`;
}

function computeCrossSession() {
  const minPct = parseInt($("filterPct").value) || 0, lv = levelFilter();
  const build = list => {
    const groups = {};
    for (const d of list) {
      if (d.pct < minPct || !matchesLevel(d, lv) || (row0Only && d.r !== 0)) continue;
      const g = groups[d.pair + "|" + d.c + "|" + d.r + "|" + d.col + "|" + d.s1] ||= { hits: [], sum: 0 };
      g.hits.push(d);
      g.sum += d.pct;
    }
    return Object.values(groups)
      .filter(g => g.hits.length >= 2)
      .map(g => {
        g.hits.sort((a, b) => (a.sess || 1) - (b.sess || 1));
        const s = g.hits[0];
        return { pair: s.pair, col: s.col, c: s.c, r: s.r, s1: s.s1, s2: s.s2, n: g.hits.length, avg: Math.round(g.sum / g.hits.length), hits: g.hits };
      })
      .sort((a, b) => b.n - a.n || b.avg - a.avg);
  };
  return { rev: build(allRevs), mom: build(allMoms) };
}

function startBelow100(list) {

  list.forEach(function (x) {

async function downloadCSV(csv, filename) {
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: filename, types: [{ description: "CSV File", accept: { "text/csv": [".csv"] } }] });
      const w = await handle.createWritable();
      await w.write(csv);
      await w.close();
    } catch (e) {
      if (e.name !== "AbortError") toast("Save failed: " + e.message, "err");
    }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 3000);
  } catch (e) {
    toast("Download failed: " + e.message, "err");
  }
}

function simSignals() {
  const minPct = parseInt($("filterPct").value) || 0, best = {};
  for (const d of allRevs.concat(allMoms)) {
    if (d.s1 !== 1 || d.s2 !== 2 || d.pct < minPct || (row0Only && d.r !== 0)) continue;
    const k = (d.sess || 1) + "|" + d.pair, b = best[k];
    if (!b || d.pct > b.pct || (d.pct === b.pct && (d.c1 || 0) > (b.c1 || 0))) best[k] = d;
  }
  return Object.values(best);
}

function simRun() {
  const out = [], PR = PRE_ROLL_SECS;
  const ws = last.sessMin ? Math.max(1, Math.round(last.winSec / (last.sessMin * 60))) : 1;
  const sessSec = Math.round(last.winSec / ws);
  for (const sg of simSignals()) {
    const D = simData[sg.pair];
    if (!D) continue;
    if (!D.ext) {
      const e = new Float64Array(PR + D.prices.length).fill(-1), p0 = D.pre;
      if (p0 && p0.length) e.set(p0.length > PR ? p0.slice(p0.length - PR) : p0, PR - Math.min(p0.length, PR));
      e.set(D.prices, PR);
      D.ext = e;
    }
    const ext = D.ext, sess = sg.sess || 1, c = sg.c, code = sg.col === "G" ? 1 : 2;
    const si = last.sliceNo ? 1 : sess;
        const a = last.sessMin ? (si - 1) * sessSec : 0;
    const b = last.sessMin ? (si === ws ? D.prices.length : si * sessSec + 1) : D.prices.length;
        const len = b - a, st = D.startTsUtc + a;
    let rc = 0, rs = 0, first = true;
    for (let i = (((sg.r - st) % c) + c) % c; i < len; i += c) {
      const p = ext[PR + a + i], pk = PR + i - c;
      const prevP = i >= c ? ext[PR + a + i - c] : (pk >= 0 ? ext[a + pk] : -1);
      const cont = !first;
      first = false;
      let nc, ns;
      if (prevP === -1) nc = ns = (p === -1 || i < c) ? 0 : 1;
      else if (p === -1) nc = ns = 0;
      else if (p > prevP) { nc = 1; ns = cont && rc === 1 && rs > 0 ? rs + 1 : 1; }
      else if (p < prevP) { nc = 2; ns = cont && rc === 2 && rs > 0 ? rs + 1 : 1; }
      else { nc = rc; ns = 0; }
      rc = nc; rs = ns;
      if (ns !== sg.s1 || nc !== code) continue;
      const j = i + c;
      if (j >= len) continue;
      const q = ext[PR + a + j];
      if (p === -1 || q === -1) continue;
      let res = 0;
      if (q !== p) {
        const continues = (q > p) === (code === 1);
        res = continues === (sg.type === "MOM") ? 1 : -1;
      }
      out.push({ sess, res });
    }
  }
  return out;
}

function simRender() {
  const amt = parseFloat($("simAmt").value) || 0, pay = parseFloat($("simPay").value) || 0;
  sim.amt = amt; sim.pay = pay;
  try { localStorage.setItem("ws_sim", JSON.stringify(sim)); } catch (e) {}
  const by = {}, tot = { n: 0, w: 0, l: 0, p: 0 };
  for (const t of simTrades) {
    const g = by[t.sess] ||= { s: t.sess, n: 0, w: 0, l: 0, p: 0 };
    const k = t.res > 0 ? "w" : t.res < 0 ? "l" : "p";
    g.n++; g[k]++; tot.n++; tot[k]++;
  }
  const pl = g => g.w * amt * pay / 100 - g.l * amt;
  const money = v => (v >= 0 ? "+" : "-") + Math.abs(v).toFixed(2);
  const cls = v => v > 0 ? "sim-pos" : v < 0 ? "sim-neg" : "";
  const wr = g => g.w + g.l ? (g.w / (g.w + g.l) * 100).toFixed(1) + "%" : "-";
  const sessTime = s => {
    if (!last.startIST || !last.sessMin) return "";
    const [h, m] = last.startIST.split(":").map(Number), t0 = h * 60 + m + (s - 1) * last.sessMin;
    return hm(t0) + "-" + hm(t0 + last.sessMin) + " IST";
  };
  if (!tot.n) {
    $("simRes").innerHTML = '<div class="sim-msg">No signal hits to simulate with current filters</div>';
    return;
  }
  const list = Object.values(by).sort((x, y) => x.s - y.s), net = pl(tot);
  const rowsHtml = list.map(g => {
    const tl = sessTime(g.s);
    return `<tr class="${cls(pl(g))}"><td>S${g.s}${tl ? `<br><span class="pop-sub">${tl}</span>` : ""}</td><td>${g.n}</td>` +
      `<td>${g.w} / ${g.l} / ${g.p}</td><td>${wr(g)}</td><td>${money(pl(g))}</td></tr>`;
  }).join("");
  const sum = `<div class="sim-sum"><div><span>NET P/L</span><b class="${cls(net)}">${money(net)}</b></div>` +
    `<div><span>WIN RATE</span><b>${wr(tot)}</b></div><div><span>TRADES</span><b>${tot.n}</b></div>` +
    `<div><span>WINS</span><b class="sim-pos">${tot.w}</b></div><div><span>LOSSES</span><b class="sim-neg">${tot.l}</b></div>` +
    `<div><span>PUSH</span><b>${tot.p}</b></div></div>`;
  const colg = "<colgroup>" + [26, 14, 22, 16, 22].map(w => `<col style="width:${w}%">`).join("") + "</colgroup>";
  $("simRes").innerHTML =
    `<div class="xs-head"><span>FINAL RESULT · ALL SESSIONS</span><span>${list.length} sessions</span></div>${sum}` +
    `<div class="xs-head"><span>PER SESSION</span><span>${tot.n} trades</span></div>` +
    `<table class="sim-t">${colg}<thead><tr><th>SESSION</th><th>TRADES</th><th>W / L / P</th><th>WIN%</th><th>P/L</th></tr></thead>` +
    `<tbody>${rowsHtml}<tr class="${cls(net)}" style="font-weight:700"><td>TOTAL</td><td>${tot.n}</td>` +
    `<td>${tot.w} / ${tot.l} / ${tot.p}</td><td>${wr(tot)}</td><td>${money(net)}</td></tr></tbody></table>`;
}

function openSim() {
  if (!allRevs.length && !allMoms.length) { toast("Run a scan first", "err"); return; }
  let el = $("simPop");
  if (!el) {
    el = document.createElement("div");
    el.id = "simPop";
    el.innerHTML = `<div class="sim-box"><div class="pop-title">TRADE SIMULATION · EXPIRY = SIGNAL CYCLE</div>` +
      `<div class="sim-in"><label>TRADE AMOUNT<input type="number" id="simAmt" min="0" step="any" inputmode="decimal"></label>` +
      `<label>PAYOUT %<input type="number" id="simPay" min="0" step="any" inputmode="decimal"></label></div>` +
      `<div id="simRes"></div><button type="button" class="cancel-btn" id="simClose">CLOSE</button></div>`;
    document.body.appendChild(el);
    el.addEventListener("click", e => { if (e.target === el || e.target.id === "simClose") el.classList.remove("show"); });
    el.addEventListener("input", simRender);
  }
  $("simAmt").value = sim.amt;
  $("simPay").value = sim.pay;
  simTrades = simRun();
  simRender();
  el.classList.add("show");
}

async function exportXsCSV() {
  const x = computeCrossSession(), total = last.sessCount, rows = [];
  for (const [type, list] of [["REV", x.rev], ["MOM", x.mom]]) {
    for (const g of list) {
      const det = g.hits.map(h => `S${h.sess || 1}:${h.c1}/${h.c2}`).join("|");
      rows.push([type, pairName(g.pair), g.col === "R" ? "BEARISH" : "BULLISH", g.c, g.r, g.s1, g.s2, g.n, total, g.avg, det].join(","));
    }
  }
  if (!rows.length) { toast("No session repeats to export", "err"); return; }
  const headers = "TYPE,PAIR,DIRECTION,CYCLE,ROW,STREAK_FROM,STREAK_TO,HITS,DATASETS,AVG_PROB_%,DETAIL_SESSION:C1/C2";
  await downloadCSV([headers, ...rows].join("\n"), `wallspectrum_session_repeats_${new Date().toISOString().slice(0, 10)}.csv`);
  toast(`Exported ${rows.length} session repeat(s) to CSV`, "ok");
}

function keypad(title, key, min, max) {
  let buf = String(cfg[key]), fresh = true;
  const draw = () => showPop(
    `<div class="pop-box"><div class="pop-title">${title}</div><div class="pop-display">${buf || "0"}${key === "minPct" ? "%" : ""}</div><div class="pop-grid pk">` +
    [1, 2, 3, 4, 5, 6, 7, 8, 9].map(q => `<button type="button" data-k="${q}" class="pop-btn">${q}</button>`).join("") +
    '<button type="button" data-k="b" class="pop-btn">&#9003;</button><button type="button" data-k="0" class="pop-btn">0</button><button type="button" data-k="ok" class="pop-btn ok">OK</button></div></div>',
    ev => {
      const b = ev.target.closest(".pop-btn");
      if (!b) return;
      const k = b.dataset.k;
      if (k === "ok") {
        const n = parseInt(buf, 10);
        cfg[key] = Math.max(min, Math.min(max, isNaN(n) ? min : n));
        closePop();
        return;
      }
      if (k === "b") { buf = buf.slice(0, -1); fresh = false; }
      else {
        if (fresh) { buf = ""; fresh = false; }
        if (buf.length < 3) buf += k;
      }
      draw();
    });
  draw();
}

function togglePair(v) {
  if (v === "__ALL__") {
    allPairsMode = !allPairsMode;
    selPairs.clear();
    return;
  }
  if (allPairsMode) { allPairsMode = false; selPairs = new Set([v]); return; }
  if (!selPairs.delete(v)) selPairs.add(v);
  if (!selPairs.size) allPairsMode = true;
}

function pairText() {
  if (allPairsMode) return "ALL";
  const chosen = ALL_PAIRS.filter(p => selPairs.has(p));
  return !chosen.length ? "-" : chosen.length === 1 ? pairLabel(chosen[0]) : chosen.length + " PAIRS";
}

function winMinutes() {
  const [a, b] = ["from", "to"].map(k => { const [h, m] = cfg[k].split(":").map(Number); return h * 60 + m; });
  return a === b ? 1440 : (b < a ? b + 1440 : b) - a;
}

function sessionPopup() {
  const N = winMinutes(), cur = cfg.sess || N;
  const [sh, sm] = cfg.from.split(":").map(Number), st = sh * 60 + sm;
  let h = `<div class="pop-box"><div class="pop-title">SESSION - ${hm(st)}-${hm(st + N)} (${fmtSess(N)})</div>` +
    `<div class="pop-display small">CYCLE MAX C${cfg.cmax} - SESSION MUST BE LONGER (DIMMED = TOO SHORT)</div><div class="pop-grid pss">`;
  var opts = [];
    for (let q = 60; q < N; q += 60) if (N % q === 0) opts.push(q);
    opts.push(N);
    for (const d of opts) {
    const ok = d * 60 > cfg.cmax, cnt = N / d, slot = i => hm(st + i * d) + "-" + hm(st + (i + 1) * d);
    const sp = i => `<span class="pop-slot" data-i="${i}" style="display:block;padding:2px 0${d === cur && sessSel === i + 1 ? ";font-weight:700;text-decoration:underline" : ""}">${slot(i)}</span>`;
        const tl = cnt <= 12
          ? Array.from({ length: cnt }, (_, i) => sp(i)).join("")
          : sp(0) + "...<br>" + sp(cnt - 1);
    h += `<button type="button" data-d="${d}" data-ok="${ok ? 1 : 0}" class="pop-btn${d === cur ? " on" : ""}${ok ? "" : " dim"}">${fmtSess(d)} &times;${cnt}<br><span class="pop-sub">${tl}</span></button>`;
  }
  showPop(h + "</div></div>", ev => {
    const b = ev.target.closest(".pop-btn");
    if (!b || b.dataset.ok !== "1") return;
        const d = +b.dataset.d, spEl = ev.target.closest(".pop-slot");
        cfg.sess = d === N ? 0 : d;
        sessSel = spEl && d !== N ? +spEl.dataset.i + 1 : null;
    closePop();
  });
}

      for (i = 1; i <= 12; i++) om += '<option value="' + i + '"' + (i === d.m ? " selected" : "") + op + '>' + MONTHS[i - 1].slice(0, 3) + '</option>';
      for (i = y1; i >= y0; i--) oy += '<option value="' + i + '"' + (i === d.y ? " selected" : "") + op + '>' + i + '</option>';
      return '<div class="b-date" style="display:flex;align-items:stretch;border-right:1px solid rgba(0,4,50,.3)">' +
        '<select id="dbD" style="' + st + ';border-right:1px solid rgba(0,4,50,.45)">' + od + '</select>' +
        '<select id="dbM" style="' + st + ';border-right:1px solid rgba(0,4,50,.45)">' + om + '</select>' +
        '<select id="dbY" style="' + st + '">' + oy + '</select></div>';
    };
    var sessCtl = function () {
        var st = "display:block;flex:1 1 0;min-height:0;width:100%;padding:0;border:0;border-radius:0;background:transparent;color:#000432;-webkit-text-fill-color:#000432;font-family:var(--mono);font-size:clamp(9px,1.5vw,15px);font-weight:500;text-align:center;text-align-last:center;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none";
        var op = ' style="background:#fff;color:#000432;-webkit-text-fill-color:#000432"';
        var wk = cfg.from === "05:30" && cfg.to === "05:30" ? "a" : "b";
            var wo = [["a", "05:30&rarr;05:30"], ["b", "11:30&rarr;23:30"]];
        var wsOpts = wo.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === wk ? " selected" : "") + op + '>' + o[1] + '</option>'; }).join("");
        var cur = cfg.sess || N, sizes = [], q;
        for (q = 60; q < N; q += 60) if (N % q === 0) sizes.push(q);
        sizes.push(N);
        var szOpts = sizes.filter(function (z) { return z * 60 > cfg.cmax || z === cur; }).map(function (z) {
          return '<option value="' + z + '"' + (z === cur ? " selected" : "") + op + '>' + fmtSess(z) + '</option>';
        }).join("");
        var dsOpts = '<option value="0"' + (cfg.dayShift ? "" : " selected") + op + '>NEW</option><option value="-1"' + (cfg.dayShift ? " selected" : "") + op + '>OLDER</option>';
            var rowSt = st + ";width:auto;height:100%;border-right:1px solid rgba(0,4,50,.3)";
                        var bt = function (on) { return "flex:1 1 0;min-width:0;min-height:0;padding:0 4px;border:1px solid rgba(0,4,50,.35);border-radius:4px;white-space:nowrap;cursor:pointer;font-family:var(--mono);font-size:clamp(9px,1.2vw,14px);font-weight:600;-webkit-appearance:none;appearance:none;" + (on ? "background:#000432;color:#fff;-webkit-text-fill-color:#fff" : "background:transparent;color:#000432;-webkit-text-fill-color:#000432"); };
            return '<div class="b-sess" style="display:flex;flex-direction:row;align-items:stretch;gap:4px;padding:4px;box-sizing:border-box;min-width:0;border-right:1px solid rgba(0,4,50,.3)">' +
              '<div style="display:flex;flex-direction:column;gap:3px;flex:1.3 1 0;min-width:0">' + wo.map(function (o) { return '<button type="button" data-win="' + o[0] + '" style="' + bt(o[0] === wk) + '">' + o[1] + '</button>'; }).join("") + '</div>' +
              
              '<div style="flex:2 1 0;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:3px">' + sizes.filter(function (z) { return z * 60 > cfg.cmax || z === cur; }).map(function (z) { return '<button type="button" data-size="' + z + '" style="' + bt(z === cur) + '">' + fmtSess(z) + '</button>'; }).join("") + '</div></div>';
      };
      var sliceCtl = function () {
          var st = "flex:1 1 0;min-width:0;width:100%;height:100%;padding:0;border:0;border-radius:0;background:transparent;color:#000432;-webkit-text-fill-color:#000432;font-family:var(--mono);font-size:clamp(9px,1.5vw,16px);font-weight:500;text-align:center;text-align-last:center;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none";
          var op = ' style="background:#fff;color:#000432;-webkit-text-fill-color:#000432"';
          var cnt = cfg.sess ? Math.round(N / cfg.sess) : 1, i;
          var st0 = cfg.from.split(":").map(Number), s0 = st0[0] * 60 + st0[1];
              var o = '<option value="0"' + (sessSel == null ? " selected" : "") + op + '>' + hm(s0) + "-" + hm(s0 + N) + '</option>';
          if (cnt >= 2) for (i = 0; i < cnt; i++) o += '<option value="' + (i + 1) + '"' + (sessSel === i + 1 ? " selected" : "") + op + '>' + sliceLbl(i) + '</option>';
          return '<div class="b-slice" style="display:flex;align-items:stretch;border-right:1px solid rgba(0,4,50,.3)"><select id="bSlice" style="' + st + '">' + o + '</select></div>';
        };
        var pairCtl = function () {
            var st = "flex:1 1 0;min-width:0;width:100%;height:100%;padding:0;border:0;border-radius:0;background:transparent;color:#000432;-webkit-text-fill-color:#000432;font-family:var(--mono);font-size:clamp(10px,2.2vw,20px);font-weight:500;text-align:center;text-align-last:center;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none";
            var op = ' style="background:#fff;color:#000432;-webkit-text-fill-color:#000432"';
            var single = !allPairsMode && selPairs.size === 1;
            var o = '<option value="__ALL__"' + (allPairsMode ? " selected" : "") + op + '>ALL</option>';
            if (!allPairsMode && !single) o += '<option value="__MULTI__" selected disabled' + op + '>' + pairText() + '</option>';
            PAIR_GROUPS.forEach(function (g) {
              o += '<optgroup label="' + g[0] + '">';
              g[1].forEach(function (p) {
                o += '<option value="' + p + '"' + (single && selPairs.has(p) ? " selected" : "") + op + '>' + pairLabel(p) + '</option>';
              });
              o += '</optgroup>';
            });
            return '<div class="b-pair" style="display:flex;align-items:stretch;border-right:1px solid rgba(0,4,50,.3)"><select id="bPair" style="' + st + '">' + o + '</select></div>';
          };
          const cell = (cls, act, txt) => cls === "sess" ? sessCtl() : cls === "slice" ? sliceCtl() :  `<button type="button" class="b-${cls}" data-act="${act}"><b>${txt}</b></button>`;
  $("bar").innerHTML =
    cell("pair", "pair", pairText()) + cell("date", "date", pad2(d.d) + " " + (MONTHS[d.m - 1] || "").slice(0, 3) + " " + d.y + (cfg.dayShift && cfg.from === cfg.to ? " (OLDER)" : "")) +
    cell("sess", "sess", "SESS " + (cfg.sess ? fmtSess(cfg.sess) : "FULL")) +
        cell("slice", "slice", sliceBtnText()) +
        cell("cmin", "cmin", cfg.cmin) + cell("cmax", "cmax", cfg.cmax) +
        cell("cache", "cache", '<span style="font-size:clamp(20px,3vw,32px);line-height:1">&#10005;</span>') +
        cell("run", "run", "&#9654;");
}

$("bar").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
    if (b.dataset.win) {
      if (b.dataset.win === "b") { cfg.from = "11:30"; cfg.to = "23:30"; cfg.dayShift = 0; }
      else { cfg.from = cfg.to = "05:30"; cfg.dayShift = 0; }
      cfg.sess = 0;
      sessSel = null;
      renderBar();
      return;
    }
    if (b.dataset.size) {
      const z = +b.dataset.size, nn = winMinutes();
      cfg.sess = z === nn ? 0 : z;
      sessSel = null;
      renderBar();
      return;
    }
    ACTIONS[b.dataset.act]?.();
});
$("scanCancelBtn").addEventListener("click", () => { if (scanRunning) cancelFlag = true; });
function openSel(id) {
  setTimeout(function () {
    var s = $(id);
    if (!s) return;
    s.focus();
    if (s.showPicker) { try { s.showPicker(); } catch (err) {} }
  }, 60);
}
$("bar").addEventListener("change", function (e) {
  var id = e.target.id;
  if (id === "bWin") {
      var k = e.target.value;
                if (k === "b") { cfg.from = "11:30"; cfg.to = "23:30"; cfg.dayShift = 0; cfg.sess = 0; sessSel = null; renderBar(); return; }
          if (k === "b") { cfg.from = "10:30"; cfg.to = "22:30"; cfg.dayShift = 0; }
          else { cfg.from = cfg.to = "05:30"; cfg.dayShift = 0; }
              cfg.sess = 0;
              sessSel = null;
              renderBar();
                  return;
    }
    if (id === "bPair") {
            var pv = e.target.value;
            if (pv === "__MULTI__") return;
            if (pv === "__ALL__") { allPairsMode = true; selPairs.clear(); }
            else { allPairsMode = false; selPairs = new Set([pv]); }
            renderBar();
            return;
          }
        if (id === "bDay") {
        cfg.dayShift = +e.target.value;
        renderBar();
        return;
      }
      if (id === "bSlice") {
          sessSel = +e.target.value || null;
                    if (last.sliceNo && last.sliceNo !== sessSel) { renderBar(); toast("Scan again to load this slice", "err"); return; }
          renderBar();
          if (allRevs.length || allMoms.length) {
            if (last.sessMin !== cfg.sess) toast("Scan again with this session size", "err");
            else renderTable();
          }
          return;
        }
        if (id === "bSize") {
      var z = +e.target.value, nn = winMinutes();
      cfg.sess = z === nn ? 0 : z;
          sessSel = null;
          renderBar();
              return;
    }
    if (id !== "dbD" && id !== "dbM" && id !== "dbY") return;
  setDate(+$("dbY").value, +$("dbM").value, +$("dbD").value);
  renderBar();
});

// ── init ──
renderBar();
(async () => {
  try {
    const stored = await idbGetAll(), keys = Object.keys(stored);
    Object.assign(tickCache, stored);
    if (keys.length) toast(`Restored ${keys.length} cached day(s) from disk`, "ok", 2500);
  } catch (e) {
    console.warn("Failed to restore tick cache from IndexedDB", e);
  }
  cacheReady = true;
})();
</script>
</body>
</html>
