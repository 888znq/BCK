<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WALLSPECTRUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0420; --surface: #140a3a; --panel: #140a3a;
  --border: #3d2fa0; --border2: #6c4cff;
  --green: #00f5a0; --red: #ff5c7a; --cyan: #00e5ff; --amber: #ffb800;
  --text: #ffffff; --text-dim: #a79bf0; --text-mid: #d6ceff;
  --sig-green: #00e676; --sig-red: #ff2e5b;
  --mono: 'JetBrains Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
::-webkit-scrollbar { display: none; }
html, body { background: var(--bg); }
body {
  color: var(--text); font: 16px/1.5 var(--sans);
  height: 100vh; height: 100dvh; overflow: hidden;
}
body::before {
  content: ""; position: fixed; inset: 8px; z-index: 1100;
  border: 2px solid var(--green); border-radius: 32px; pointer-events: none;
}

/* layout */
.layout {
  position: fixed; top: 8px; left: 8px; right: 8px;
  bottom: calc(8px + 9vh); bottom: calc(8px + 9dvh);
  display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr;
  background: var(--bg); border-radius: 32px 32px 0 0; overflow: hidden;
}
.main { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

/* filter bar */
.filter-bar {
  display: none; align-items: center; flex-wrap: wrap; gap: 4px;
  padding: 12px 26px 6px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.filter-bar.show { display: flex; }
.filter-bar input, .filter-bar select {
  min-width: 0; padding: 6px 4px; background: var(--panel); color: var(--text);
  border: 1px solid var(--border2); border-radius: 4px;
  font-family: var(--mono); font-size: 15px; outline: none;
}
.filter-bar input { flex: 1 1 40px; }
.filter-bar select { flex: 1 1 90px; }
.filter-bar input:focus { border-color: var(--green); }
.filter-bar :disabled { opacity: .45; pointer-events: none; }
.export-btn {
  padding: 7px 12px; background: transparent; color: var(--cyan);
  border: 1px solid var(--cyan); border-radius: 4px;
  font-family: var(--mono); font-size: 12px; letter-spacing: .08em;
  white-space: nowrap; cursor: pointer; transition: all .15s;
}
.filter-bar .export-btn { flex: 1 1 auto; padding: 7px 8px; font-size: 11px; }
.export-btn:hover { background: rgba(46,213,115,.1); box-shadow: 0 0 10px rgba(46,213,115,.3); }
.export-btn.on { background: var(--green); color: #000432; }

/* results area */
.table-area { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden auto; }
.split-table-wrap {
  flex: 1 1 0; min-height: 0; width: 100%; background: var(--bg);
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr);
}
.split-pane {
  display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%;
  overflow: hidden; background: var(--bg); border-right: 1px solid var(--bg);
}
.split-pane:first-child { border-right: 2px solid var(--border2); }
.split-pane:last-child { border-right: none; }
.pane-head {
  display: flex; justify-content: space-between; align-items: center; flex: none;
  padding: 6px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: clamp(9px, 2.6vw, 13px); color: var(--text-mid);
}
.pane-body { flex: 1 1 0; min-height: 0; overflow: hidden auto; padding-bottom: 8px; }

table {
  width: 100%; border-collapse: collapse; table-layout: fixed;
  font-family: var(--mono); font-size: clamp(8px, 2.4vw, 14px);
}
thead tr { position: sticky; top: 0; z-index: 10; background: var(--panel); }
th, td { text-align: left; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
th {
  padding: 6px 2px 6px 4px; font-size: clamp(7px, 2vw, 12px); font-weight: 500;
  text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--border);
}
tbody tr { border-bottom: 1px solid var(--border); }
.split-pane td { padding: 6px 2px 6px 4px; height: 30px; vertical-align: middle; }
.split-pane th { vertical-align: middle; }
.split-pane th:first-child, .split-pane td:first-child { padding-left: 14px; }
.split-pane th:nth-child(5), .split-pane td:nth-child(5) { text-align: right; padding-right: 12px; }
.split-pane th:nth-child(6), .split-pane td:nth-child(6) { text-align: center; }
.split-pane th:nth-child(7), .split-pane td:nth-child(7) { text-align: right; padding-right: 14px; }
.cell-pair { letter-spacing: .03em; }
.sort-th { cursor: pointer; color: var(--green); }
.row-red { color: var(--sig-red); cursor: pointer; }
.row-green { color: var(--sig-green); cursor: pointer; }
.row-red:hover { background: rgba(230,57,70,.08); border-left: 2px solid var(--sig-red); }
.row-green:hover { background: rgba(46,213,115,.08); border-left: 2px solid var(--sig-green); }

/* expandable prime lifecycle log */
.prime-log {
  background: #060216; padding: 8px 12px !important; height: auto !important;
  font-size: 11px; color: var(--text-dim); white-space: normal !important;
  line-height: 1.55; max-height: 340px; overflow-y: auto; border-bottom: 1px solid var(--border2);
}
.meta-bar {
  display: flex; flex-wrap: wrap; gap: 8px; padding: 5px 8px; margin-bottom: 6px;
  background: rgba(255,255,255,.03); border: 1px solid rgba(108,76,255,.4); border-radius: 4px;
}
.badge { padding: 1px 6px; border-radius: 3px; background: rgba(255,46,91,.2); color: var(--sig-red); font-weight: 700; }
.badge-emb { padding: 1px 6px; border-radius: 3px; background: rgba(255,184,0,.2); color: var(--amber); font-weight: 700; }
.tag-king { padding: 1px 5px; border-radius: 3px; background: rgba(0,230,118,.18); color: var(--sig-green); font-weight: 700; font-size: 10px; }
.tag-deth { padding: 1px 5px; border-radius: 3px; background: rgba(255,46,91,.18); color: var(--sig-red); font-weight: 700; font-size: 10px; }
.G { color: var(--sig-green); } .R { color: var(--sig-red); } .A { color: var(--amber); } .C { color: var(--cyan); }

.lvl-hdr { cursor: pointer; background: var(--panel); border-bottom: 1px solid var(--border2); }
.split-pane .lvl-hdr td { padding: 5px 14px; color: var(--green); font-size: 12px; font-weight: 700; }
.lvl-hdr div { display: flex; align-items: center; justify-content: space-between; }
.lvl-tog { padding: 1px 8px; border: 1px solid var(--border2); border-radius: 3px; font-size: 10px; color: var(--text); }

.state-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 300px; gap: 14px; color: var(--text-dim);
  font-family: var(--mono); font-size: 14px; text-align: center;
}
.table-area > .state-empty { flex: 1 1 auto; }
.split-pane .state-empty {
  flex-direction: row; align-items: flex-start; justify-content: flex-start;
  min-height: 0; padding: 10px 4px; gap: 8px; font-size: 11px; text-align: left;
}

/* session ranking + cross-session view */
.rank-wrap { flex: none; margin-bottom: 6px; }
.rank-cards { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 2px; }
.rank-card { flex: 0 0 auto; min-width: 96px; padding: 5px 8px; border: 1px solid var(--border2); border-radius: 5px; text-align: center; }
.rank-card.top { border-color: var(--green); }
.rk-lbl { font-size: 10px; color: var(--text-dim); }
.rk-time, .rk-sub { font-size: 9px; color: var(--text-dim); }
.rk-val { font-size: 14px; font-weight: 700; }
.rank-card.top .rk-val { color: var(--green); }

.xs-wrap { flex: none; width: 100%; }
.xs-pane { border-bottom: 2px solid var(--border2); }
.xs-pane .state-empty { min-height: 80px; font-size: 12px; }
.xs-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: 13px; letter-spacing: .04em; color: var(--text-mid);
}
.xs-t th { padding: 6px 3px; font-size: clamp(9px, 2.6vw, 12px); }
.xs-t td { padding: 5px 3px; font-size: clamp(11px, 3.2vw, 15px); }
.xs-t tr.xs-m { border-bottom: 0; }
.xs-t tr.xs-d td {
  padding: 0 3px 7px; font-size: clamp(9px, 2.6vw, 12px);
  white-space: normal; word-break: break-word; opacity: .85;
}
.xs-t td.xs-hits { font-weight: 700; }

/* bottom settings bar */
#settingsOverlay {
  position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 900; display: flex;
  height: 9vh; height: 9dvh; overflow: hidden; background: var(--bg);
  border-top: 1px solid var(--border2); border-radius: 0 0 32px 32px;
}
#settingsOverlay.scanning { top: 8px; height: auto; z-index: 960; border-top: 0; border-radius: 32px; }
#settingsOverlay.scanning .bar { display: none; }
.bar {
  flex: 1; min-width: 0; min-height: 0; display: grid; overflow: hidden;
  grid-template-columns: 1.4fr 3fr 3.4fr 1.6fr 1.2fr 1.2fr 1.4fr;
  grid-template-rows: 1fr 1fr; background: var(--bg); border-radius: 0 0 30px 30px;
}
.bar button {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 0; min-height: 0; padding: 0; border: 0; border-right: 1px solid rgba(0,4,50,.3); border-radius: 0;
  color: #000432; -webkit-text-fill-color: #000432; font-family: var(--mono);
  cursor: pointer; touch-action: manipulation;
}
.bar button:hover { filter: brightness(1.15); }
option, optgroup { background: #140a3a !important; color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; }
.bar b { max-width: 100%; font-size: clamp(10px, min(2.4vw, 2.6vh), 22px); font-weight: 500; line-height: 1; }
.b-pair { grid-area: 1/1/3/2; padding-left: 14px !important; background: #ffd60a; }
.b-pair b { font-size: clamp(10px, min(2.2vw, 2.8vh), 20px); white-space: normal; word-break: break-all; text-align: center; }
.b-date { grid-area: 1/2/3/3; background: #ff9500; }
.b-date b { font-size: clamp(11px, 3.4vw, 20px); white-space: nowrap; }
.b-mon { grid-area: 1/3/3/4; background: #54A0FF; }
.b-mon b { font-size: clamp(7px, 2.6vw, 14px); white-space: nowrap; overflow: hidden; }
.b-yr { grid-area: 1/4/3/5; background: #A29BFE; }
.b-fh { grid-area: 1/5; background: #FF9FF3; border-bottom: 1px solid rgba(0,4,50,.3) !important; }
.b-fm { grid-area: 1/6; background: #48DBFB; border-bottom: 1px solid rgba(0,4,50,.3) !important; }
.b-th { grid-area: 2/5; background: #FF9FF3; }
.b-tm { grid-area: 2/6; background: #48DBFB; }
.b-fh::before, .b-th::before {
  position: absolute; top: 1px; left: 3px; font-size: 7px; letter-spacing: .06em; opacity: .7;
}
.b-fh::before { content: "START"; }
.b-th::before { content: "END"; }
.b-sess { grid-area: 1/3/3/4; background: #3ddcf5; }
.b-slice { grid-area: 1/4/3/5; background: #6ea8ff; }
.b-slice b { font-size: clamp(9px, 1.8vw, 18px); white-space: nowrap; line-height: 1.2; text-align: center; }
.b-sess b { font-size: clamp(9px, 1.8vw, 18px); white-space: nowrap; line-height: 1.2; text-align: center; }
.b-cmin { grid-area: 1/5; background: #e3b8ff; border-bottom: 1px solid rgba(0,4,50,.3) !important; }
.b-cmax { grid-area: 2/5; background: #c48bff; }
.b-prob { grid-area: 1/9/3/10; background: #FECA57; }
.b-cache { grid-area: 1/6/3/7; background: #ff5c7a; }
#dbD { background: #ffc266 !important; }
#dbM { background: #ffad33 !important; }
#dbY { background: #ff9500 !important; }
#bWin { background: #3ddcf5 !important; }
#bSize { background: #67c8ff !important; }
.bar select:hover { filter: brightness(1.1); }
.b-cache b { font-size: clamp(9px, 1.8vw, 18px); line-height: 1.2; text-align: center; }
.b-sim { grid-area: 1/11/3/12; background: #FFEAA7; }
.b-sim b { font-size: clamp(9px, 1.8vw, 18px); }
.b-run { grid-area: 1/7/3/8; padding-right: 14px !important; background: #00f5a0; border-right: 0 !important; }

/* scan view */
#scanPage { display: none; flex-direction: column; width: 100%; height: 100%; padding: 14px 12px; }
#settingsOverlay.scanning #scanPage { display: flex; }
.scan-title { flex: none; margin-bottom: 6px; font-family: var(--mono); font-size: 16px; letter-spacing: .12em; color: var(--green); }
.progress-head { display: flex; justify-content: space-between; margin-bottom: 8px; font-family: var(--mono); font-size: 15px; }
#progressLabel { color: var(--text-mid); }
#progressPct { color: var(--green); }
.progress-track { flex: none; height: 8px; border-radius: 2px; overflow: hidden; }
#progressFill { width: 0; height: 100%; background: var(--green); border-radius: 2px; transition: width .3s ease; }
#scanLog {
  flex: 1 1 0; min-height: 0; margin-top: 8px; padding: 8px 10px; overflow-y: auto;
  border: 1px solid var(--border2); border-radius: 4px;
  font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--text-mid);
}
#scanLog div { padding: 1px 0; border-bottom: 1px solid rgba(255,255,255,.05); word-break: break-word; }
#scanLog div:first-child { color: var(--green); }
.cancel-btn {
  flex: none; width: 100%; margin-top: 10px; padding: 14px 16px; background: transparent; color: var(--text-mid);
  border: 1px solid var(--border2); border-radius: 4px; font-family: var(--mono); font-size: 14px;
  letter-spacing: .05em; cursor: pointer;
}
.cancel-btn:hover { background: rgba(255,255,255,.08); }

/* popups */
#pop {
  display: none; position: fixed; inset: 0; z-index: 1200; padding: 10px;
  align-items: center; justify-content: center; background: rgba(8,2,30,.82);
}
.pop-box {
  width: min(560px, 96vw); max-height: 96vh; overflow-y: auto; padding: 12px;
  background: var(--surface); border: 1px solid var(--border2); border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.pop-title { margin-bottom: 10px; text-align: center; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--green); }
.pop-grid { display: grid; gap: 6px; }
.pop-grid.ph { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.pop-grid.pm { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.pop-grid.pd { grid-template-columns: repeat(7, minmax(0, 1fr)); }
.pop-grid.pmo, .pop-grid.pk { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pop-grid.py, .pop-grid.pp { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pop-grid.pss { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pop-btn {
  height: 48px; padding: 0; background: transparent; color: var(--text-mid);
  border: 1px solid var(--border2); border-radius: 6px;
  font-family: var(--mono); font-size: 17px; cursor: pointer; touch-action: manipulation;
}
.pm .pop-btn { height: 40px; font-size: 14px; }
.pmo .pop-btn { font-size: 13px; letter-spacing: 0; white-space: nowrap; overflow: hidden; }
.pp .pop-btn { height: 40px; font-size: 12px; }
.pss .pop-btn { height: auto; min-height: 58px; padding: 4px 2px; font-size: 14px; line-height: 1.15; }
.pop-btn:hover { border-color: var(--green); color: var(--text); }
.pop-btn.on, .pop-btn.ok { background: var(--green); border-color: var(--green); color: #000432; font-weight: 700; }
.pop-btn.dim { opacity: .28; cursor: not-allowed; }
.pop-sub { display: block; font-size: 10px; font-weight: 400; line-height: 1.3; }
.pop-dow { text-align: center; font-family: var(--mono); font-size: 12px; font-weight: 700; line-height: 24px; color: var(--text-dim); }
.pop-dow.we { color: #e58f99; }
.pop-display {
  margin-bottom: 10px; padding: 8px; text-align: center; color: var(--green);
  border: 1px solid var(--border2); border-radius: 6px; font-family: var(--mono); font-size: 36px;
}
.pop-display.small { padding: 6px; font-size: 12px; }

/* toast */
#toast {
  position: fixed; right: 24px; bottom: calc(9vh + 24px); bottom: calc(9dvh + 24px); z-index: 999;
  max-width: 340px; padding: 12px 18px; background: var(--panel); color: var(--text);
  border: 1px solid var(--border2); border-radius: 6px; font-family: var(--mono); font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
#toast.show { opacity: 1; }
#toast.err { border-color: var(--red); color: var(--red); }
#toast.ok { border-color: var(--green); color: var(--green); }

/* trade simulation */
#simPop {
  display: none; position: fixed; inset: 0; z-index: 1250; padding: 10px;
  align-items: center; justify-content: center; background: rgba(8,2,30,.82);
}
#simPop.show { display: flex; }
.sim-box {
  width: min(640px, 96vw); max-height: 96vh; overflow-y: auto; padding: 12px;
  background: var(--surface); border: 1px solid var(--border2); border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6); font-family: var(--mono);
}
.sim-in { display: flex; gap: 8px; margin-bottom: 10px; }
.sim-in label { flex: 1; font-size: 11px; letter-spacing: .08em; color: var(--text-dim); }
.sim-in input {
  display: block; width: 100%; margin-top: 4px; padding: 8px; background: var(--panel); color: var(--text);
  border: 1px solid var(--border2); border-radius: 4px; font-family: var(--mono); font-size: 18px; outline: none;
}
.sim-in input:focus { border-color: var(--green); }
.sim-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 8px 0 10px; }
.sim-sum > div { padding: 6px; border: 1px solid var(--border2); border-radius: 5px; text-align: center; }
.sim-sum span { display: block; font-size: 10px; color: var(--text-dim); }
.sim-sum b { font-size: 16px; font-weight: 700; }
.sim-t td, .sim-t th { padding: 6px 4px; height: auto; white-space: normal; }
.sim-t { font-size: 13px; }
.sim-pos { color: var(--sig-green); }
.sim-neg { color: var(--sig-red); }
.sim-msg { padding: 24px 8px; text-align: center; color: var(--text-dim); font-size: 13px; }
</style>
</head>
<body>

<div class="layout">
  <div class="main">
    <div class="filter-bar" id="filterBar">
      <input type="number" id="filterPct" placeholder="100" min="0" max="100">
      <select id="levelFilter">
        <option value="__ALL__" selected>ALL LEVELS</option>
        <option value="1-2">X1→X2</option>
        <option value="2-3">X2→X3</option>
        <option value="3-4">X3→X4</option>
        <option value="4-5">X4→X5</option>
        <option value="5-6">X5→X6</option>
        <option value="6-7">X6→X7</option>
        <option value="7-8">X7→X8</option>
        <option value="8-9">X8→X9</option>
        <option value="9-10">X9→X10</option>
      </select>
      <button type="button" class="export-btn" id="row0Btn" onclick="toggleRow0()">ROW 0 ONLY</button>
      <button type="button" class="export-btn on" id="lvlsBtn" onclick="toggleLvls()" title="Best % row of every level at once">LVLS</button>
      <button type="button" class="export-btn on" id="ordBtn" onclick="toggleOrd()" title="With LVLS: list levels in order X1, X2, X3...">ORD</button>
      <button type="button" class="export-btn" id="xsBtn" onclick="toggleXs()" style="display:none">BY SESSION</button>
    </div>
    <div class="table-area" id="tableArea"></div>
  </div>
</div>

<div id="settingsOverlay">
  <div class="bar" id="bar"></div>
  <div id="scanPage">
    <div class="scan-title">SCANNING…</div>
    <div class="progress-head"><span id="progressLabel">Initialising…</span><span id="progressPct">0%</span></div>
    <div class="progress-track"><div id="progressFill"></div></div>
    <div id="scanLog"></div>
    <button type="button" class="cancel-btn" id="scanCancelBtn">■ CANCEL SCAN</button>
  </div>
</div>

<div id="pop"></div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const pad2 = n => (n < 10 ? "0" : "") + n;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hm = t => { const q = ((t % 1440) + 1440) % 1440; return pad2(Math.floor(q / 60)) + ":" + pad2(q % 60); };
const fmtSess = m => m < 60 ? m + "m" : Math.floor(m / 60) + "h" + (m % 60 ? (m % 60) + "m" : "");
const fmtIST = ts => { const t = ((ts + 19800) % 86400 + 86400) % 86400; return pad2(Math.floor(t / 3600)) + ":" + pad2(Math.floor((t % 3600) / 60)) + ":" + pad2(t % 60); };

const WS_URL = "wss://api.derivws.com/trading/v1/options/ws/public?app_id=1089";
const IST_OFFSET = 19800;
const PRIME_MIN_PROB = 75;
const MONTHS = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const PAIR_GROUPS = [

// ── tick cache (IndexedDB) ──
const IDB_NAME = "wallspectrum_cache", IDB_STORE = "ticks";
let idbReady = null;

function idbOpen() {
  idbReady ||= new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }).catch(err => { console.warn("IndexedDB unavailable, using memory cache only", err); return null; });
  return idbReady;
}
async function idbTx(mode, fn) {
  const db = await idbOpen();
  if (!db) return;
  return new Promise(resolve => {
    try {
      const tx = db.transaction(IDB_STORE, mode);
      fn(tx.objectStore(IDB_STORE));
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    } catch { resolve(); }
  });
}
const idbSet = (k, v) => idbTx("readwrite", s => s.put(v, k));
const idbClear = () => idbTx("readwrite", s => s.clear());
async function idbGetAll() {
  const out = {};
  await idbTx("readonly", s => {
    s.openCursor().onsuccess = e => {
      const c = e.target.result;
      if (c) { out[c.key] = c.value; c.continue(); }
    };
  });
  return out;
}
async function clearPersistedCache() {
  for (const k in tickCache) delete tickCache[k];
  await idbClear();
  toast("Cache cleared", "ok");
}

// ── tick fetching ──
function fetchChunk(pair, t0, t1) {
  return new Promise(resolve => {
    const result = {};
    let ws;
    const done = () => { clearTimeout(timer); try { ws.close(); } catch {} resolve(result); };
    const timer = setTimeout(done, 25000);
    try {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => ws.send(JSON.stringify({ ticks_history: pair, start: t0, end: t1, count: 5000, style: "ticks" }));
      ws.onmessage = ev => {
        const d = JSON.parse(ev.data);
        if (d.history) for (let i = 0; i < d.history.times.length; i++) result[+d.history.times[i]] = +d.history.prices[i];
        if (d.history || d.error) done();
      };
      ws.onerror = ws.onclose = done;
    } catch { done(); }
  });
}

async function loadTicksForDay(pair, dayEpoch, secFrom, secTo, cached, logCb) {
  const start = dayEpoch + secFrom, end = dayEpoch + secTo;
  const actualEnd = Math.min(end, Math.floor(Date.now() / 1000));
  if (actualEnd < start) return [];

  const length = end - start + 1;
  const prices = new Float64Array(length).fill(-1);
  if (cached) for (let i = 0, n = Math.min(length, cached.length); i < n; i++) prices[i] = cached[i];

  const gapMin = /^(cry|1HZ)/i.test(pair) ? 120 : 900;
  const gaps = [];
  let gapStart = -1;
  for (let i = 0; i <= actualEnd - start; i++) {
    if (prices[i] === -1) {
      if (gapStart === -1) gapStart = start + i;
    } else if (gapStart !== -1) {
      if (start + i - 1 - gapStart >= gapMin) gaps.push([gapStart, start + i - 1]);
      gapStart = -1;
    }
  }
  if (gapStart !== -1) gaps.push([gapStart, actualEnd]);

  const chunks = [];
  for (const [a, b] of gaps) for (let s = a; s <= b; s += 901) chunks.push([s, Math.min(s + 900, b)]);

  const WORKERS = 16;
  for (let i = 0; i < chunks.length; i += WORKERS) {
    if (cancelFlag) return null;
    const batch = chunks.slice(i, i + WORKERS);
    logCb(`gaps: chunks ${i + 1}–${Math.min(i + WORKERS, chunks.length)}/${chunks.length}`);
    const results = await Promise.all(batch.map(async (c, idx) => {
      let map = {}, retries = 0, delay = idx * 600;
      while (retries <= 3) {
        if (delay) await sleep(delay);
        map = await fetchChunk(pair, c[0], c[1]);
        if (Object.keys(map).length > 0) break;
        retries++;
        delay = 2000 * retries;
      }
      return map;
    }));
    for (const res of results) {
      for (const ts in res) {
        const idx = +ts - start;
        if (idx >= 0 && idx < length) prices[idx] = res[ts];
      }
    }
    await sleep(1300);
  }
  return Array.from(prices);
}

const PRE_ROLL_SECS = 900;
async function loadPreRoll(pair, startTs) {
  const arr = new Float64Array(PRE_ROLL_SECS).fill(-1);
  const t0 = startTs - PRE_ROLL_SECS, t1 = startTs - 1;
  if (t0 >= Math.floor(Date.now() / 1000)) return Array.from(arr);
  let map = {};
  for (let tr = 0; tr < 4 && !cancelFlag; tr++) {
    map = await fetchChunk(pair, t0, t1);
    if (Object.keys(map).length > 0) break;
    await sleep(1500);
  }
  for (const ts in map) {
    const j = +ts - t0;
    if (j >= 0 && j < PRE_ROLL_SECS) arr[j] = map[ts];
  }
  return Array.from(arr);
}

// ── Ported Prime Tracker & 30s Lifecycle Engine (inside Web Worker) ──
function workerMain() {
  const pad2 = n => (n < 10 ? "0" : "") + n;
  const fmtIST = ts => {
    const t = ((ts + 19800) % 86400 + 86400) % 86400;
    return pad2(Math.floor(t / 3600)) + ":" + pad2(Math.floor((t % 3600) / 60)) + ":" + pad2(t % 60);
  };

  function applyWallspectrumPipeline(revs, moms) {
    const c2k = x => x.type === "MOM" ? (x.c1 || 0) - (x.c2 || 0) : (x.c2 || 0);
    const c2c1 = (a, b) => (a.c - b.c) || c2k(a) - c2k(b) || (b.c1 || 0) - (a.c1 || 0) || b.pct - a.pct || a.r - b.r;
    const bestC2 = list => {
      const seen = {}, seenP = {};
      return list.filter(x => {
        const k = `${x.c}|${c2k(x)}`, pk = `${x.c}|${x.s1}|${x.pair}`;
        if (seen[k] || seenP[pk]) return false;
        seen[k] = 1; seenP[pk] = 1;
        return true;
      });
    };
    const lvlOrd = list => list.sort((a, b) => (a.c - b.c) || (a.s1 - b.s1) || c2k(a) - c2k(b) || (b.c1 || 0) - (a.c1 || 0) || b.pct - a.pct || a.r - b.r);
    const bestLv = list => {
      const b = {};
      list.forEach(x => {
        const k = `${x.c}|${x.s1}`, o = b[k];
        if (!o || x.pct > o.pct || (x.pct === o.pct && (x.c1 || 0) > (o.c1 || 0))) b[k] = x;
      });
      return list.filter(x => b[`${x.c}|${x.s1}`] === x);
    };
    const revAll = lvlOrd(bestC2(revs.sort(c2c1)));
    const momAll = lvlOrd(bestC2(moms.sort(c2c1)));
    return { rev: bestLv(revAll), mom: bestLv(momAll), revAll, momAll };
  }

  function evalRawSlotMetric(st, r, colChar, s, type, includeActive) {
    if (!st) return null;
    const k = colChar === "R" ? 1 : 0;
    const raw = st.hist[k][r];
    let maxS = st.maxLen[k][r];
    const wantColor = k ? 2 : 1;
    const act = includeActive && st.rowColor[r] === wantColor && st.rowStreak[r] >= 1 ? st.rowStreak[r] : 0;
    if (act > maxS) maxS = act;
    if (maxS < s) return null;

    let c1 = 0, c2 = 0;
    for (let i = maxS; i >= s; i--) {
      const cnt = (raw ? (raw[i] || 0) : 0) + (act === i ? 1 : 0);
      if (cnt) {
        c1 += cnt;
        if (i >= s + 1) c2 += cnt;
      }
    }
    if (c1 <= 0) return null;
    const pct = type === "REV" ? (100 - Math.round(c2 / c1 * 100)) : Math.round(c2 / c1 * 100);
    return { c1, c2, pct, currentStreak: st.rowColor[r] === wantColor ? st.rowStreak[r] : 0 };
  }

  function buildSignalsFromStates(states, pair, includeActive) {
    const revs = [], moms = [];
    for (const st of states) {
      const { c, rowColor, rowStreak, maxLen, hist } = st;
      for (let r = 0; r < c; r++) {
        for (let k = 0; k < 2; k++) {
          const raw = hist[k][r];
          let maxS = maxLen[k][r];
          const act = includeActive && rowColor[r] === (k ? 2 : 1) && rowStreak[r] >= 1 ? rowStreak[r] : 0;
          if (act > maxS) maxS = act;
          if (!maxS) continue;
          let cum = 0; const cm = {};
          for (let i = maxS; i >= 1; i--) {
            const cnt = (raw ? (raw[i] || 0) : 0) + (act === i ? 1 : 0);
            if (cnt) cum += cnt;
            if (cum > 0) cm[i] = cum;
          }
          for (const key in cm) {
            const s = +key, c1 = cm[s], c2 = cm[s + 1] || 0;
            const base = { pair, c, r, s1: s, s2: s + 1, c1, c2, col: k ? "R" : "G" };
            revs.push({ ...base, pct: 100 - Math.round(c2 / c1 * 100), type: "REV" });
            if (c1 > 1) moms.push({ ...base, pct: Math.round(c2 / c1 * 100), type: "MOM" });
          }
        }
      }
    }
    return applyWallspectrumPipeline(revs, moms);
  }

  self.onmessage = e => {
    const { prices, minC, maxC, pair, startTsUtc, pre } = e.data;
    const preLen = pre ? pre.length : 0;
    const n = prices.length;
    const states = [];
    const stateByC = {};

    for (let c = minC; c <= maxC; c++) {
      const st = {
        c,
        rowColor: new Int8Array(c),
        rowStreak: new Int16Array(c),
        rowCol: new Int32Array(c).fill(-2),
        maxLen: [new Int16Array(c), new Int16Array(c)],
        hist: [new Array(c).fill(null), new Array(c).fill(null)]
      };
      states.push(st);
      stateByC[c] = st;
    }

    const record = (st, r, col, s) => {
      const k = col === 1 ? 0 : 1, h = st.hist[k][r] ||= {};
      h[s] = (h[s] || 0) + 1;
      if (s > st.maxLen[k][r]) st.maxLen[k][r] = s;
    };

    const curLeader = { REV: {}, MOM: {} };
    const dethroneLog = { REV: {}, MOM: {} };
    const tradeStats = { REV: {}, MOM: {} };
    const candidates = {};
    const challengerLog = { REV: {}, MOM: {} };
    const levelLeaders = { REV: {}, MOM: {} };

    const EVAL_EVERY = 30;
    let nextEvalAt = startTsUtc;

    const alive = sig => {
      const st = stateByC[sig.c];
      if (!st) return false;
      const want = sig.col === "G" ? 1 : 2;
      return st.rowColor[sig.r] === want && st.rowStreak[sig.r] >= sig.s1;
    };

    const registerLevelKing = (type, csKey, s, sig, ts, tsStr) => {
      if (!levelLeaders[type][csKey]) levelLeaders[type][csKey] = {};
      const lKey = `C${sig.c}_R${sig.r}_${sig.col}`;
      const candRef = candidates[lKey];
      if (!levelLeaders[type][csKey][lKey]) {
        levelLeaders[type][csKey][lKey] = {
          c: sig.c,
          r: sig.r,
          col: sig.col,
          level: s,
          order: Object.keys(levelLeaders[type][csKey]).length + 1,
          embryoBornStr: candRef ? candRef.firstSeenStr : tsStr,
          becameLeaderAtStr: tsStr,
          becameLeaderAtTs: ts,
          initialC1: sig.c1,
          initialC2: sig.c2,
          initialPct: sig.pct,
          dethronedAtStr: null,
          dethronedAtTs: null,
          atDethroneC1: null,
          atDethroneC2: null,
          atDethronePct: null,
          dethroneCount: 0,
          lastSeenC1: sig.c1,
          lastSeenC2: sig.c2,
          lastSeenPct: sig.pct,
          lastSeenStreak: sig.s1,
          status: "ACTIVE_KING"
        };
      } else {
        levelLeaders[type][csKey][lKey].status = "ACTIVE_KING";
      }
      return levelLeaders[type][csKey][lKey];
    };

    const updateAllRegisteredKings = includeActive => {
      for (const type of ["REV", "MOM"]) {
        for (const csKey in levelLeaders[type]) {
          const s = Number(csKey.split("_")[1]);
          const map = levelLeaders[type][csKey];
          for (const lKey in map) {
            const rec = map[lKey];
            const m = evalRawSlotMetric(stateByC[rec.c], rec.r, rec.col, s, type, includeActive);
            if (m) {
              rec.lastSeenC1 = m.c1;
              rec.lastSeenC2 = m.c2;
              rec.lastSeenPct = m.pct;
              rec.lastSeenStreak = m.currentStreak;
            }
          }
        }
      }
    };

    const trackCandidatesAndLeaders = ts => {
      const snap = buildSignalsFromStates(states, pair, true);
      const tsStr = fmtIST(ts);

      for (const [type, all] of [["REV", snap.revAll], ["MOM", snap.momAll]]) {
        const byCycleLvl = {};
        for (const sig of all) {
          const csKey = `${sig.c}_${sig.s1}`;
          (byCycleLvl[csKey] ||= []).push(sig);

          const cKey = `C${sig.c}_R${sig.r}_${sig.col}`;
          if (!candidates[cKey]) {
            candidates[cKey] = {
              c: sig.c, r: sig.r, col: sig.col,
              firstSeenTs: ts, firstSeenStr: tsStr,
              lastSeenTs: ts, lastSeenStr: tsStr,
              maxLevel: sig.s1,
              appearances: 0,
              levelBirths: {},
              becameLeaderAt: null,
              becameLeaderLevel: null
            };
          }
          const cand = candidates[cKey];
          cand.lastSeenTs = ts;
          cand.lastSeenStr = tsStr;
          cand.appearances++;
          if (sig.s1 > cand.maxLevel) cand.maxLevel = sig.s1;
          if (!cand.levelBirths[sig.s1]) {
            cand.levelBirths[sig.s1] = { ts, timeStr: tsStr, c1: sig.c1, c2: sig.c2, pct: sig.pct };
          }
        }

        const csKeys = new Set([...Object.keys(byCycleLvl), ...Object.keys(curLeader[type])]);
        for (const csKey of csKeys) {
          const s = Number(csKey.split("_")[1]);
          const prev = curLeader[type][csKey];
          const levelPool = byCycleLvl[csKey] || [];

          if (prev && alive(prev)) {
            const topChallenger = levelPool.find(x => alive(x) && (x.r !== prev.r || x.col !== prev.col));
            if (topChallenger) {
              const chKey = `${type}_${csKey}_R${topChallenger.r}_${topChallenger.col}`;
              if (!challengerLog[type][csKey]) challengerLog[type][csKey] = {};
              if (!challengerLog[type][csKey][chKey]) {
                const candRef = candidates[`C${topChallenger.c}_R${topChallenger.r}_${topChallenger.col}`];
                challengerLog[type][csKey][chKey] = {
                  sig: topChallenger,
                  emergedAt: tsStr,
                  emergedTs: ts,
                  embryoFirstSeen: candRef ? candRef.firstSeenStr : tsStr,
                  incubationSec: candRef ? (ts - candRef.firstSeenTs) : 0,
                  incumbentAtTime: `C${prev.c} R${prev.r} (${prev.pct}%)`
                };
              }
            }
            continue;
          }

          const nxt = levelPool.find(alive) || null;
          if (nxt) {
            const nxtCand = candidates[`C${nxt.c}_R${nxt.r}_${nxt.col}`];
            if (nxtCand && !nxtCand.becameLeaderAt) {
              nxtCand.becameLeaderAt = tsStr;
              nxtCand.becameLeaderLevel = s;
              nxtCand.incubationDurationSec = ts - nxtCand.firstSeenTs;
            }
            registerLevelKing(type, csKey, s, nxt, ts, tsStr);
          }

          if (prev) {
            const prevKey = `C${prev.c}_R${prev.r}_${prev.col}`;
            const prevKingRec = levelLeaders[type][csKey] && levelLeaders[type][csKey][prevKey];
            const liveM = evalRawSlotMetric(stateByC[prev.c], prev.r, prev.col, s, type, true);
            if (prevKingRec) {
              prevKingRec.dethroneCount++;
              if (!prevKingRec.dethronedAtStr) {
                prevKingRec.dethronedAtStr = tsStr;
                prevKingRec.dethronedAtTs = ts;
                prevKingRec.atDethroneC1 = liveM ? liveM.c1 : prev.c1;
                prevKingRec.atDethroneC2 = liveM ? liveM.c2 : prev.c2;
                prevKingRec.atDethronePct = liveM ? liveM.pct : prev.pct;
              }
              prevKingRec.status = "DETHRONED";
            }

            const nxtCand = nxt ? candidates[`C${nxt.c}_R${nxt.r}_${nxt.col}`] : null;
            const levelBirth = nxtCand && nxtCand.levelBirths[s] ? nxtCand.levelBirths[s].timeStr : (nxt ? tsStr : "-");
            const embryoBirth = nxtCand ? nxtCand.firstSeenStr : (nxt ? tsStr : "-");
            const incSec = nxtCand ? (ts - nxtCand.firstSeenTs) : 0;

            (dethroneLog[type][csKey] ||= []).push({
              from: prev,
              fromResolvedC1: liveM ? liveM.c1 : prev.c1,
              fromResolvedC2: liveM ? liveM.c2 : prev.c2,
              fromResolvedPct: liveM ? liveM.pct : prev.pct,
              to: nxt,
              at: tsStr,
              reason: "LEADER_RESOLVED_OR_SUPERSEDED",
              toEmbryoFirstSeen: embryoBirth,
              toLevelBirth: levelBirth,
              incubationSec: incSec
            });
          }
          curLeader[type][csKey] = nxt;
        }
      }

      updateAllRegisteredKings(true);
    };

    for (let i = 0; i < n; i++) {
      const total = startTsUtc + i, p = prices[i];

      for (let si = 0; si < states.length; si++) {
        const st = states[si], c = st.c;
        let prevP = -1;
        if (i >= c) prevP = prices[i - c];
        else if (preLen) { const pk = preLen + i - c; if (pk >= 0) prevP = pre[pk]; }

        const col = Math.floor(total / c), row = total % c, cont = st.rowCol[row] === col - 1;
        const oldC = st.rowColor[row], oldS = st.rowStreak[row];
        let newC, newS;
        if (prevP === -1) newC = newS = (p === -1 || i < c) ? 0 : 1;
        else if (p === -1) newC = newS = 0;
        else if (p > prevP) { newC = 1; newS = cont && oldC === 1 && oldS > 0 ? oldS + 1 : 1; }
        else if (p < prevP) { newC = 2; newS = cont && oldC === 2 && oldS > 0 ? oldS + 1 : 1; }
        else { newC = oldC; newS = 0; }

        if (cont && oldS >= 1 && oldC !== 0 && p !== -1 && prevP !== -1 && p !== prevP) {
          const colChar = oldC === 1 ? "G" : "R", continued = newC === oldC;
          const csKey = `${c}_${oldS}`;
          for (const type of ["REV", "MOM"]) {
            const matchKey = `C${c}_R${row}_${colChar}`;
            if (oldS <= (candidates[matchKey]?.maxLevel || 0) || states[si].rowStreak[row] >= oldS) {
              const stObj = states[si];
              if (stObj.rowColor[row] === oldC && stObj.rowStreak[row] >= oldS) {
                const tst = (tradeStats[type][csKey] ||= { w: 0, l: 0 });
                (type === "REV" ? !continued : continued) ? tst.w++ : tst.l++;
              }
            }
          }
        }

        const streakEnded = newS === 1 && oldS > 0 && oldC !== 0 && cont;
        if (streakEnded) record(st, row, oldC, oldS);
        st.rowColor[row] = newC; st.rowStreak[row] = newS; st.rowCol[row] = col;
      }

      if (total >= nextEvalAt) { trackCandidatesAndLeaders(total); nextEvalAt = total + EVAL_EVERY; }
    }

    for (const st of states) {
      for (let r = 0; r < st.c; r++) {
        if (st.rowStreak[r] >= 1 && st.rowColor[r] !== 0) record(st, r, st.rowColor[r], st.rowStreak[r]);
      }
    }

    trackCandidatesAndLeaders(startTsUtc + n - 1);
    updateAllRegisteredKings(false);

    const finalStanding = buildSignalsFromStates(states, pair, false);
    self.postMessage({
      revs: finalStanding.revAll,
      moms: finalStanding.momAll,
      dethroneLog,
      tradeStats,
      candidates,
      challengerLog,
      levelLeaders
    });
  };
}

// ── Cross-Cycle Prime Selection Engine (Ported from App 1) ──
function selectBestPrimeForLevelAcrossRange(allKingsOnLevel, fallbackSig, pair, sess, type, lvl, primeMinProb) {
  if (!allKingsOnLevel || !allKingsOnLevel.length) return { chosen: fallbackSig, rankedDurable: [] };

  const maxC1 = Math.max(...allKingsOnLevel.map(k => k.lastSeenC1 || 0));
  const minSampleC1 = maxC1 >= 6 ? 4 : 1;

  const durable = allKingsOnLevel
    .filter(k => k.lastSeenPct >= primeMinProb && k.lastSeenC1 >= minSampleC1)
    .sort((a, b) =>
      (a.becameLeaderAtTs - b.becameLeaderAtTs) ||
      (b.lastSeenPct - a.lastSeenPct) ||
      (b.lastSeenC1 - a.lastSeenC1) ||
      (a.c - b.c)
    );

  let chosenKing = null;
  if (durable.length > 0) {
    chosenKing = durable[0];
  } else {
    const sortedFallback = [...allKingsOnLevel].sort((a, b) =>
      (b.lastSeenPct - a.lastSeenPct) ||
      (a.becameLeaderAtTs - b.becameLeaderAtTs) ||
      (b.lastSeenC1 - a.lastSeenC1) ||
      (a.c - b.c)
    );
    chosenKing = sortedFallback[0];
  }

  if (!chosenKing) return { chosen: fallbackSig, rankedDurable: durable };

  return {
    chosen: {
      pair,
      sess,
      c: chosenKing.c,
      r: chosenKing.r,
      s1: lvl,
      s2: lvl + 1,
      c1: chosenKing.lastSeenC1,
      c2: chosenKing.lastSeenC2,
      pct: chosenKing.lastSeenPct,
      col: chosenKing.col,
      type,
      durablePoolCount: durable.length,
      totalPoolCount: allKingsOnLevel.length,
      primeReason: durable.length > 0
        ? `EARLY_DURABLE_PRIME (Crowned ${chosenKing.becameLeaderAtStr}, Final ${chosenKing.lastSeenPct}% >= ${primeMinProb}%, Pool ${durable.length}/${allKingsOnLevel.length})`
        : `ADAPTIVE_BEST_PRIME (Crowned ${chosenKing.becameLeaderAtStr}, Final ${chosenKing.lastSeenPct}%, Pool ${allKingsOnLevel.length})`
    },
    rankedDurable: durable.slice(0, 10)
  };
}

function finalizePrimeFromMeta(revs, moms, meta, pair, sess) {
  const aggTradeStats = { REV: {}, MOM: {} };
  for (const type of ["REV", "MOM"]) {
    for (const csKey in meta.tradeStats[type]) {
      const lvl = Number(csKey.split("_")[1]);
      const st = meta.tradeStats[type][csKey];
      const agg = (aggTradeStats[type][lvl] ||= { w: 0, l: 0 });
      agg.w += st.w;
      agg.l += st.l;
    }
  }
  meta.aggTradeStats = aggTradeStats;
  meta.topContendersByLevel = { REV: {}, MOM: {} };
  meta.primeBest = { REV: {}, MOM: {} };

  for (const [type, list] of [["REV", revs], ["MOM", moms]]) {
    const fallbacksByLvl = {};
    for (const d of list) {
      const o = fallbacksByLvl[d.s1];
      if (!o || d.pct > o.pct || (d.pct === o.pct && d.c1 > o.c1)) fallbacksByLvl[d.s1] = d;
    }
    const kingsByLvl = {};
    for (const csKey in meta.levelLeaders[type]) {
      const lvl = Number(csKey.split("_")[1]);
      const klist = Object.values(meta.levelLeaders[type][csKey]);
      (kingsByLvl[lvl] ||= []).push(...klist);
    }

    const allLvls = new Set([...Object.keys(fallbacksByLvl), ...Object.keys(kingsByLvl)].map(Number));
    const sortedLvls = [...allLvls].sort((a, b) => a - b);

    for (const lvl of sortedLvls) {
      const fb = fallbacksByLvl[lvl];
      const pool = kingsByLvl[lvl] || [];
      const { chosen, rankedDurable } = selectBestPrimeForLevelAcrossRange(pool, fb, pair, sess, type, lvl, PRIME_MIN_PROB);
      if (chosen) {
        meta.primeBest[type][lvl] = chosen;
        meta.topContendersByLevel[type][lvl] = rankedDurable;
        const winCsKey = `${chosen.c}_${lvl}`;
        const winLKey = `C${chosen.c}_R${chosen.r}_${chosen.col}`;
        if (meta.levelLeaders[type][winCsKey] && meta.levelLeaders[type][winCsKey][winLKey]) {
          meta.levelLeaders[type][winCsKey][winLKey].status = "GLOBAL_PRIME_WINNER";
        }
      }
    }
  }
}

function workerScan(prices, minC, maxC, pair, startTsUtc, onProgress, pre, sess = 1) {
  return new Promise(resolve => {
    const total = maxC - minC + 1;
    const nWorkers = Math.min(navigator.hardwareConcurrency || 4, 16, total);
    const per = Math.ceil(total / nWorkers);
    const shards = [];
    for (let s = minC; s <= maxC; s += per) shards.push([s, Math.min(s + per - 1, maxC)]);
    const revs = [], moms = [];
    const meta = {
      dethroneLog: { REV: {}, MOM: {} },
      tradeStats: { REV: {}, MOM: {} },
      candidates: {},
      challengerLog: { REV: {}, MOM: {} },
      levelLeaders: { REV: {}, MOM: {} }
    };
    let done = 0;
    const finish = () => {
      done++;
      if (onProgress) onProgress(done / shards.length);
      if (done === shards.length) {
        finalizePrimeFromMeta(revs, moms, meta, pair, sess);
        scanMeta[`${pair}|${sess}`] = meta;
        // Inject prime winners into revs and moms so dynamic filtering can access them
        for (const lvl in meta.primeBest.REV) {
          const pw = meta.primeBest.REV[lvl];
          pw._isPrimeWinner = true;
          revs.push(pw);
        }
        for (const lvl in meta.primeBest.MOM) {
          const pw = meta.primeBest.MOM[lvl];
          pw._isPrimeWinner = true;
          moms.push(pw);
        }
        resolve([revs, moms]);
      }
    };
    for (const [a, b] of shards) {
      const w = new Worker(getWorkerURL());
      const buf = new Float64Array(prices);
      w.onmessage = e => {
        for (const x of e.data.revs) { x.sess = sess; revs.push(x); }
        for (const x of e.data.moms) { x.sess = sess; moms.push(x); }
        Object.assign(meta.candidates, e.data.candidates);
        for (const t of ["REV", "MOM"]) {
          Object.assign(meta.dethroneLog[t], e.data.dethroneLog[t]);
          Object.assign(meta.tradeStats[t], e.data.tradeStats[t]);
          Object.assign(meta.challengerLog[t], e.data.challengerLog[t]);
          Object.assign(meta.levelLeaders[t], e.data.levelLeaders[t]);
        }
        w.terminate();
        finish();
      };
      w.onerror = () => { w.terminate(); finish(); };
      const pbuf = pre ? Float64Array.from(pre) : null;
      w.postMessage({ prices: buf, minC: a, maxC: b, pair, startTsUtc, pre: pbuf }, [buf.buffer]);
    }
  });
}

async function workerScanSessions(prices, cMin, cMax, pair, startTs, winSec, sessMin, onFrac, pre0, sliceNo) {
  const PR = PRE_ROLL_SECS;
  const ext = new Float64Array(PR + prices.length).fill(-1);
  if (pre0 && pre0.length) ext.set(pre0.length > PR ? pre0.slice(pre0.length - PR) : pre0, PR - Math.min(pre0.length, PR));
  ext.set(prices, PR);
  if (!sessMin) return workerScan(prices, cMin, cMax, pair, startTs, onFrac, ext.subarray(0, PR), sliceNo || 1);
  const n = Math.max(1, Math.round(winSec / (sessMin * 60)));
  const sessSec = Math.round(winSec / n);
  let merged = null;
  for (let si = 0; si < n; si++) {
    if (cancelFlag) break;
    const a = si * sessSec, b = si === n - 1 ? prices.length : (si + 1) * sessSec + 1;
    const slice = prices.slice(a, b);
    if (slice.length <= cMax) continue;
    const sIdx = sliceNo || (si + 1);
    const r = await workerScan(slice, cMin, cMax, pair, startTs + a, f => onFrac && onFrac((si + f) / n), ext.subarray(a, a + PR), sIdx);
    for (const list of r) for (const it of list) it.sess = sIdx;
    merged = merged ? [merged[0].concat(r[0]), merged[1].concat(r[1])] : r;
  }
  return merged || [[], []];
}

let lastLog = "";

  if (!t || t === lastLog) return;
  lastLog = t;
  const d = document.createElement("div");
  d.textContent = t;

  $("progressPct").textContent = Math.round(pct) + "%";

function startScan() {
  if (scanRunning) { setScanView(true); return; }
  if (!cacheReady) { toast("Cache still loading, try again in a moment", "err"); return; }
  runScan();
  if (scanRunning) setScanView(true);
}

async function runScan() {
  if (scanRunning) { cancelFlag = true; return; }

  const pairs = allPairsMode ? ALL_PAIRS : (selPairs.size ? ALL_PAIRS.filter(p => selPairs.has(p)) : ["cryBTCUSD"]);
  const cycleMin = Math.max(1, cfg.cmin || 120);
  const cycleMax = Math.max(cycleMin, cfg.cmax || 180);
  const minPct = 0;

  const [fH, fM] = cfg.from.split(":").map(Number), [tH, tM] = cfg.to.split(":").map(Number);
  const istFrom = fH * 3600 + fM * 60, istTo = tH * 3600 + tM * 60;
  let secFrom, secTo;
  if (istFrom === istTo) {
    secFrom = 0; secTo = 86400;
  } else {
    secFrom = ((istFrom - IST_OFFSET) % 86400 + 86400) % 86400;
    secTo = ((istTo - IST_OFFSET) % 86400 + 86400) % 86400 || 86400;
  }
  if (secTo <= secFrom) { toast("Time window must stay inside 05:30 → 05:30 IST (end after start)", "err"); return; }
  const shiftDays = istFrom === istTo ? (cfg.dayShift || 0) : 0;

  let winSec = secTo - secFrom;
  let sessMin = cfg.sess;
  if (sessMin && (winSec % (sessMin * 60) !== 0 || sessMin * 60 >= winSec)) sessMin = cfg.sess = 0;
  if (sessMin && sessMin * 60 <= cycleMax) { toast(`Session ${sessMin}m must be longer than cycle max C${cycleMax}`, "err"); return; }

  const fullCount = sessMin ? Math.round(winSec / (sessMin * 60)) : 1;
  let sliceNo = 0;
  if (sessMin && sessSel && sessSel <= fullCount) {
    sliceNo = sessSel;
    secFrom += (sessSel - 1) * sessMin * 60;
    secTo = secFrom + sessMin * 60;
    winSec = sessMin * 60;
  }
  last = { sessCount: fullCount, sessMin, startIST: cfg.from, winSec, sliceNo };
  simData = {};
  scanMeta = {};
  xsView = last.sessCount > 1;
  $("xsBtn").style.display = xsView ? "inline-block" : "none";
  $("xsBtn").classList.toggle("on", xsView);

  scanRunning = true;
  cancelFlag = false;
  $("filterBar").classList.remove("show");
  $("tableArea").innerHTML = "";
  $("scanLog").innerHTML = "";
  lastLog = "";
  allRevs = []; allMoms = [];

  try {
    const dayEpoch = Math.floor(new Date(cfg.date + "T00:00:00Z").getTime() / 1000) + shiftDays * 86400;
    const startTsUtc = dayEpoch + secFrom;
    const n = pairs.length;
    var skippedRef = [];

    for (let pi = 0; pi < n && !cancelFlag; pi++) {
      const pair = pairs[pi], tag = `[${pi + 1}/${n}] ${pair}`;
      const fetchBase = pi / n * 60, scanBase = 60 + pi / n * 28, scanSlice = 28 / n;
      const key = `${pair}|${cfg.date}|${secFrom}-${secTo}` + (shiftDays ? "|d" + shiftDays : "");

      setProgress(fetchBase, `${tag}  syncing day`, `${pair}  ${cfg.from}–${cfg.to} IST`);
      const prices = await loadTicksForDay(pair, dayEpoch, secFrom, secTo, tickCache[key], msg => setLog(`${tag}  ${cfg.date}  ${msg}`));
      if (cancelFlag || !prices) continue;
      tickCache[key] = prices;
      idbSet(key, prices);
      const pkey = key + "|pre";
      let pre = tickCache[pkey];
      if (!pre) {
        setProgress(scanBase, `${tag}  loading pre-session reference…`);
        pre = await loadPreRoll(pair, startTsUtc);
        if (cancelFlag) continue;
        if (pre.some(v => v !== -1)) { tickCache[pkey] = pre; idbSet(pkey, pre); }
      }
      var refN = pre.slice(-Math.min(cycleMax, PRE_ROLL_SECS)).filter(v => v !== -1).length;
      setLog(`${tag}  reference ticks: ${refN}`);
      if (refN < 1) {
        skippedRef.push(pairName(pair));
        setLog(`${tag}  NO REFERENCE - skipped`);
        continue;
      }
      simData[pair] = { prices, pre, startTsUtc };

      setProgress(scanBase, `${tag}  scanning (${cfg.date})…`, `Cycles C${cycleMin}–C${cycleMax}`);
      const [revs, moms] = await workerScanSessions(prices, cycleMin, cycleMax, pair, startTsUtc, winSec, sliceNo ? 0 : sessMin, f =>
        setProgress(scanBase + f * scanSlice,
          `${tag}  ${cfg.date}  scanning… ${Math.round(f * 100)}%`,
          `C${cycleMin}–C${cycleMax}  [${navigator.hardwareConcurrency || 4} workers]`), pre, sliceNo);
      allRevs = allRevs.concat(revs);
      allMoms = allMoms.concat(moms);
    }

    if (cancelFlag) { toast("Scan cancelled", "err"); return; }

    const nRev = allRevs.filter(x => x._isPrimeWinner && x.pct >= minPct).length;
    const nMom = allMoms.filter(x => x._isPrimeWinner && x.pct >= minPct).length;
    setProgress(100, "Complete", `Done — ${nRev} REV Prime Levels | ${nMom} MOM Prime Levels`);
    $("filterBar").classList.remove("show");
    $("filterPct").value = minPct;
    renderTable();
    if (skippedRef.length) toast(`Skipped (no reference): ${skippedRef.join(", ")} — ${nRev + nMom} prime signals`, "err", 7000);
    else toast(`Scan complete — ${nRev + nMom} prime levels`, "ok");
  } finally {
    scanRunning = false;
    cancelFlag = false;
    setScanView(false);
  }
}

const SIG_COLS = "<colgroup>" + [22, 13, 11, 16, 9, 14, 15].map(w => `<col style="width:${w}%">`).join("") + "</colgroup>";

function holdPad2(n) { return n < 10 ? "0" + n : "" + n; }
function holdInfo(d) {
  try {
    var D = simData[d.pair];
    if (!D || !D.prices || !D.prices.length) return "";
    var PR = PRE_ROLL_SECS, c = d.c, s1 = d.s1, code = d.col === "G" ? 1 : 2;
    if (!(c > 0) || !(s1 >= 1)) return "";
    var hk = (d.sess || 1) + "|" + c + "|" + d.r + "|" + s1 + "|" + d.col;
    var H = D.hold || (D.hold = {});
    var h = H[hk];
    if (h === undefined) {
      if (!D.ext) {
        var e = new Float64Array(PR + D.prices.length).fill(-1), p0 = D.pre;
        if (p0 && p0.length) e.set(p0.length > PR ? p0.slice(p0.length - PR) : p0, PR - Math.min(p0.length, PR));
        e.set(D.prices, PR);
        D.ext = e;
      }
      var ext = D.ext;
      var ws = last.sessMin ? Math.max(1, Math.round(last.winSec / (last.sessMin * 60))) : 1;
      var sessSec = Math.round(last.winSec / ws);
      var si = last.sliceNo ? 1 : (d.sess || 1);
      var a = last.sessMin ? (si - 1) * sessSec : 0;
      var b = last.sessMin ? (si === ws ? D.prices.length : si * sessSec + 1) : D.prices.length;
      var len = b - a, st = D.startTsUtc + a;
      var rc = 0, rs = 0, first = -1, lastCol = -1, i, p, q, qi, nc, ns;
      for (i = (((d.r - st) % c) + c) % c; i < len; i += c) {
        p = ext[PR + a + i];
        qi = PR + a + i - c;
        q = qi >= 0 ? ext[qi] : -1;
        if (q === -1) { nc = ns = (p === -1 || i < c) ? 0 : 1; }
        else if (p === -1) { nc = ns = 0; }
        else if (p > q) { nc = 1; ns = (rc === 1 && rs > 0) ? rs + 1 : 1; }
        else if (p < q) { nc = 2; ns = (rc === 2 && rs > 0) ? rs + 1 : 1; }
        else { nc = rc; ns = 0; }
        if (ns === 1 && rs > 0 && rc === code && rs >= s1) { first = i; break; }
        rc = nc; rs = ns; lastCol = i;
      }
      if (first < 0 && rc === code && rs >= s1 && lastCol >= 0) first = lastCol;
      if (first < 0) { h = null; }
      else {
        var ek = a + "|" + b, EO = D.endOf || (D.endOf = {}), j = EO[ek];
        if (j === undefined) {
          j = len - 1;
          while (j > 0 && ext[PR + a + j] === -1) j--;
          EO[ek] = j;
        }
        h = { first: st + first, hold: Math.max(0, (j - first)) };
      }
      H[hk] = h;
    }
    if (!h) return "";
    var s = h.hold, hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
    var dur = hh > 0 ? (hh + "h " + holdPad2(mm) + "m") : (mm > 0 ? (mm + "m " + holdPad2(ss) + "s") : (ss + "s"));
    var t = (((h.first + (typeof IST_OFFSET !== "undefined" ? IST_OFFSET : 19800)) % 86400) + 86400) % 86400;
    return '<div class="holdT" style="display:block;font-size:8px;line-height:9px;font-weight:800;letter-spacing:0;opacity:.9">\u25B2 ' + dur + " \u00B7 " + holdPad2(Math.floor(t / 3600)) + ":" + holdPad2(Math.floor((t % 3600) / 60)) + ":" + holdPad2(t % 60) + "</div>";
  } catch (eH) { return ""; }
}

  const type = d.type || "REV";
  const csKey = `${d.c}_${d.s1}`;
  const lg = (meta.dethroneLog[type] && meta.dethroneLog[type][csKey]) || [];
  const st = (cfg.cmin === cfg.cmax ? meta.tradeStats[type][csKey] : meta.aggTradeStats[type][d.s1]) || { w: 0, l: 0 };
  const cand = meta.candidates[`C${d.c}_R${d.r}_${d.col}`];
  const birthStr = cand ? cand.firstSeenStr : "-";

  const chMap = (meta.challengerLog[type] && meta.challengerLog[type][csKey]) || {};

  const kingsMap = (meta.levelLeaders[type] && meta.levelLeaders[type][csKey]) || {};

      topContenders.map((k, idx) => `${idx === 0 ? "★" : `#${idx + 1}`} <b>C${k.c} R${k.r} (${k.col})</b> — Crowned: <b>${k.becameLeaderAtStr}</b> | Final: <b>${k.lastSeenC1}/${k.lastSeenC2} (${k.lastSeenPct}%)</b>`).join("<br>") +

          ? ` | At Dethrone: <b>${k.atDethroneC1}/${k.atDethroneC2} (${k.atDethronePct}%)</b>`
          : ``;
        return `#${k.order} <b>${k.col === "R" ? "↓" : "↑"} C${k.c} R${k.r}</b> ${tag} — Crowned: <b>${k.becameLeaderAtStr}</b> (Initial: ${k.initialC1}/${k.initialC2} · ${k.initialPct}%)${dethInfo} | <b>Final: ${k.lastSeenC1}/${k.lastSeenC2} (${k.lastSeenPct}%)</b>`;
      }).join("<br>") +
      `</div>`;
  }

  if (chList.length) {
    detHtml += `<div style="margin-bottom:6px;color:var(--amber)"><b>⚡ EMERGING CHALLENGERS ON C${d.c} X${d.s1}:</b><br>` +
      chList.map(ch => `• <b>${ch.sig.col === "R" ? "↓" : "↑"} C${ch.sig.c} R${ch.sig.r}</b> (${ch.sig.c1}/${ch.sig.c2} · ${ch.sig.pct}%) — Embryo First Seen: <b>${ch.embryoFirstSeen}</b> | Reached X${d.s1}: <b>${ch.emergedAt}</b> (Incubation: ${ch.incubationSec}s)`).join("<br>") +
      `</div>`;
  }

  detHtml += `<div><b>↻ DETHRONE TIMELINE [C${d.c} X${d.s1}]:</b><br>` + (lg.length
    ? lg.map((x, idx) => {
        const to = x.to
          ? `<b>${x.to.col === "R" ? "↓" : "↑"} C${x.to.c} R${x.to.r} (${x.to.c1}/${x.to.c2} · ${x.to.pct}%)</b> <span class="A">[Embryo: ${x.toEmbryoFirstSeen} | Inc: ${x.incubationSec}s]</span>`
          : `<b>(vacant)</b>`;
        const resStat = (x.fromResolvedC1 !== x.from.c1 || x.fromResolvedC2 !== x.from.c2)
          ? ` ➔ Resolved: <b>${x.fromResolvedC1}/${x.fromResolvedC2} · ${x.fromResolvedPct}%</b>`
          : ``;
        return `#${idx + 1} [${x.at}] ${x.from.col === "R" ? "↓" : "↑"} C${x.from.c} R${x.from.r} (${x.from.c1}/${x.from.c2} · ${x.from.pct}%${resStat}) ➔ ${to}`;
      }).join("<br>")
    : "No resolutions on this cycle/level — initial leader persisted.") + `</div>`;

  return detHtml;
}

function computeCrossSession() {
  const minPct = parseInt($("filterPct").value) || 0, lv = levelFilter();
  const build = list => {
    const groups = {};
    for (const d of list) {
      if (d._isPrimeWinner) continue;
      if (d.pct < minPct || !matchesLevel(d, lv) || (row0Only && d.r !== 0) || (lvlSel != null && d.s1 !== lvlSel)) continue;
      const g = groups[d.pair + "|" + d.c + "|" + d.r + "|" + d.col + "|" + d.s1] ||= { hits: [], sum: 0 };
      g.hits.push(d);
      g.sum += d.pct;
    }
    return Object.values(groups)
      .filter(g => g.hits.length >= 2)
      .map(g => {
        g.hits.sort((a, b) => (a.sess || 1) - (b.sess || 1));
        const s = g.hits[0];
        return { pair: s.pair, col: s.col, c: s.c, r: s.r, s1: s.s1, s2: s.s2, n: g.hits.length, avg: Math.round(g.sum / g.hits.length), hits: g.hits };
      })
      .sort((a, b) => b.n - a.n || b.avg - a.avg);
  };
  return { rev: build(allRevs), mom: build(allMoms) };
}

// ── Render Table using Ported 1-Best-Prime-Per-Level Selection ──
function renderTable() {
  $("lvlsBtn").classList.toggle("on", lvlsOn);
  $("ordBtn").classList.toggle("on", ordOn);
  $("row0Btn").classList.toggle("on", row0Only);
  if (lvlsOn) $("levelFilter").value = "__ALL__";
  $("levelFilter").disabled = $("filterPct").disabled = lvlsOn;

  const minPct = parseInt($("filterPct").value) || 0, lv = levelFilter();
  if (sessSel != null && sessSel > last.sessCount) sessSel = null;

  const primeRevs = allRevs.filter(x => x._isPrimeWinner);
  const primeMoms = allMoms.filter(x => x._isPrimeWinner);
  const rawRevs = allRevs.filter(x => !x._isPrimeWinner);
  const rawMoms = allMoms.filter(x => !x._isPrimeWinner);

  const activeSourceRevs = row0Only ? rawRevs : primeRevs;
  const activeSourceMoms = row0Only ? rawMoms : primeMoms;

  var _lvPre = activeSourceRevs.concat(activeSourceMoms).filter(function (x) {
    return x.pct >= minPct && matchesLevel(x, lv) && (!row0Only || x.r === 0) && (sessSel == null || (x.sess || 1) === sessSel);
  });
  Object.keys(lvlAll).forEach(function (k) { delete lvlAll[k]; });
  _lvPre.forEach(function (x) { lvlAll[x.s1] = 1; });
  if (_lvPre.length && lvlSel != null && !lvlAll[lvlSel]) lvlSel = null;

  var c2k = x => x.type === "MOM" ? (x.c1 || 0) - (x.c2 || 0) : (x.c2 || 0);
  const baseFn = x => x.pct >= minPct && matchesLevel(x, lv) && (!row0Only || x.r === 0) && (minC2 == null || (x.c2 || 0) === minC2);
  const filterFn = x => baseFn(x) && (sessSel == null || (x.sess || 1) === sessSel);

  const lvlOrd = list => lvlDir ? list.sort((a, b) => (lvlDir === 1 ? a.s1 - b.s1 : b.s1 - a.s1) || b.pct - a.pct || (b.c1 || 0) - (a.c1 || 0) || a.c - b.c || a.r - b.r) : list;

  // When multiple pairs or slices are active, pick the 1 Best Prime Winner per level across the active view
  const bestPrimePerLevel = list => {
    if (!bestLvl) return list;
    const b = {};
    list.forEach(x => {
      const k = (x.sess || 1) + "|" + x.s1, o = b[k];
      if (!o) { b[k] = x; return; }
      const xDurable = (x.primeReason || "").indexOf("EARLY_DURABLE_PRIME") === 0 ? 1 : 0;
      const oDurable = (o.primeReason || "").indexOf("EARLY_DURABLE_PRIME") === 0 ? 1 : 0;
      if (xDurable !== oDurable) {
        if (xDurable > oDurable) b[k] = x;
        return;
      }
      if (x.pct > o.pct || (x.pct === o.pct && (x.c1 || 0) > (o.c1 || 0))) b[k] = x;
    });
    const out = list.filter(x => b[(x.sess || 1) + "|" + x.s1] === x);
    return lvlDir ? out : out.sort((a, b2) => (a.s1 - b2.s1) || (a.c - b2.c) || (a.r - b2.r));
  };

  const rev = bestPrimePerLevel(lvlOrd(activeSourceRevs.filter(filterFn)));
  const mom = bestPrimePerLevel(lvlOrd(activeSourceMoms.filter(filterFn)));

  const area = $("tableArea"), rank = "";
  if (xsView && last.sessCount > 1 && sessSel == null) { area.innerHTML = rank + buildXsHTML(); return; }
  if (!rev.length && !mom.length) {
    area.innerHTML = rank + '<div class="state-empty"><div style="font-size:36px">○</div><div>No signals at current filters</div><div>Try lowering Min % or adjusting filters</div></div>';
    return;
  }
  area.innerHTML = rank + `<div class="split-table-wrap">${buildPane("REVERSAL (1 BEST PRIME PER LEVEL)", rev)}${buildPane("MOMENTUM (1 BEST PRIME PER LEVEL)", mom)}</div>`;
  markSort();
}
