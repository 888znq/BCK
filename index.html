<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WALLSPECTRUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000432; --surface: #000432; --panel: #000432;
  --border: #454a7a; --border2: #565c93;
  --green: #ccf5df; --red: #f7d9dc; --cyan: #cdf1ef;
  --text: #eef0f7; --text-dim: #767ba3; --text-mid: #b2b6d9;
  --sig-green: #2ED573; --sig-red: #E63946;
  --mono: 'JetBrains Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
::-webkit-scrollbar { display: none; }
html, body { background: var(--bg); }
body {
  color: var(--text); font: 16px/1.5 var(--sans);
  height: 100vh; height: 100dvh; overflow: hidden;
}
body::before {
  content: ""; position: fixed; inset: 8px; z-index: 1100;
  border: 2px solid var(--green); border-radius: 32px; pointer-events: none;
}

/* layout */
.layout {
  position: fixed; top: 8px; left: 8px; right: 8px;
  bottom: calc(8px + 9vh); bottom: calc(8px + 9dvh);
  display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr;
  background: var(--bg); border-radius: 32px 32px 0 0; overflow: hidden;
}
.main { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

/* filter bar */
.filter-bar {
  display: none; align-items: center; flex-wrap: wrap; gap: 4px;
  padding: 12px 26px 6px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.filter-bar.show { display: flex; }
.filter-bar input, .filter-bar select {
  min-width: 0; padding: 6px 4px; background: var(--panel); color: var(--text);
  border: 1px solid var(--border2); border-radius: 4px;
  font-family: var(--mono); font-size: 15px; outline: none;
}
.filter-bar input { flex: 1 1 40px; }
.filter-bar select { flex: 1 1 90px; }
.filter-bar input:focus { border-color: var(--green); }
.filter-bar :disabled { opacity: .45; pointer-events: none; }
.export-btn {
  padding: 7px 12px; background: transparent; color: var(--cyan);
  border: 1px solid var(--cyan); border-radius: 4px;
  font-family: var(--mono); font-size: 12px; letter-spacing: .08em;
  white-space: nowrap; cursor: pointer; transition: all .15s;
}
.filter-bar .export-btn { flex: 1 1 auto; padding: 7px 8px; font-size: 11px; }
.export-btn:hover { background: rgba(46,213,115,.1); box-shadow: 0 0 10px rgba(46,213,115,.3); }
.export-btn.on { background: var(--green); color: #000432; }

/* results area */
.table-area { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden auto; }
.split-table-wrap {
  flex: 1 1 0; min-height: 0; width: 100%; background: var(--bg);
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr);
}
.split-pane {
  display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%;
  overflow: hidden; background: var(--bg); border-right: 1px solid var(--bg);
}
.split-pane:first-child { border-right: 2px solid var(--border2); }
.split-pane:last-child { border-right: none; }
.pane-head {
  display: flex; justify-content: space-between; align-items: center; flex: none;
  padding: 6px 3px; background: var(--panel); border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: clamp(9px, 2.6vw, 13px); color: var(--text-mid);
}
.pane-body { flex: 1 1 0; min-height: 0; overflow: hidden auto; padding-bottom: 8px; }

table {
  width: 100%; border-collapse: collapse; table-layout: fixed;
  font-family: var(--mono); font-size: clamp(8px, 2.4vw, 14px);
}
thead tr { position: sticky; top: 0; z-index: 10; background: var(--panel); }
th, td { text-align: left; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
th {
  padding: 6px 2px 6px 4px; font-size: clamp(7px, 2vw, 12px); font-weight: 500;
  text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--border);
}
tbody tr { border-bottom: 1px solid var(--border); }
.split-pane td { padding: 6px 2px 6px 4px; height: 30px; vertical-align: middle; }
.cell-pair { letter-spacing: .03em; }
.row-red { color: var(--sig-red); }
.row-green { color: var(--sig-green); }
.row-red:hover { background: rgba(230,57,70,.08); border-left: 2px solid var(--sig-red); }
.row-green:hover { background: rgba(46,213,115,.08); border-left: 2px solid var(--sig-green); }

.lvl-hdr { cursor: pointer; background: var(--panel); border-bottom: 1px solid var(--border2); }
.split-pane .lvl-hdr td { padding: 5px 8px; color: var(--green); font-size: 12px; font-weight: 700; }
.lvl-hdr div { display: flex; align-items: center; justify-content: space-between; }
.lvl-tog { padding: 1px 8px; border: 1px solid var(--border2); border-radius: 3px; font-size: 10px; color: var(--text); }

.state-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 300px; gap: 14px; color: var(--text-dim);
  font-family: var(--mono); font-size: 14px; text-align: center;
}
.table-area > .state-empty { flex: 1 1 auto; }
.split-pane .state-empty {
  flex-direction: row; align-items: flex-start; justify-content: flex-start;
  min-height: 0; padding: 10px 4px; gap: 8px; font-size: 11px; text-align: left;
}

/* session ranking + cross-session view */
.rank-wrap { flex: none; margin-bottom: 6px; }
.rank-cards { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 2px; }
.rank-card { flex: 0 0 auto; min-width: 96px; padding: 5px 8px; border: 1px solid var(--border2); border-radius: 5px; text-align: center; }
.rank-card.top { border-color: var(--green); }
.rk-lbl { font-size: 10px; color: var(--text-dim); }
.rk-time, .rk-sub { font-size: 9px; color: var(--text-dim); }
.rk-val { font-size: 14px; font-weight: 700; }
.rank-card.top .rk-val { color: var(--green); }

.xs-wrap { flex: none; width: 100%; }
.xs-pane { border-bottom: 2px solid var(--border2); }
.xs-pane .state-empty { min-height: 80px; font-size: 12px; }
.xs-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: 13px; letter-spacing: .04em; color: var(--text-mid);
}
.xs-t th { padding: 6px 3px; font-size: clamp(9px, 2.6vw, 12px); }
.xs-t td { padding: 5px 3px; font-size: clamp(11px, 3.2vw, 15px); }
.xs-t tr.xs-m { border-bottom: 0; }
.xs-t tr.xs-d td {
  padding: 0 3px 7px; font-size: clamp(9px, 2.6vw, 12px);
  white-space: normal; word-break: break-word; opacity: .85;
}
.xs-t td.xs-hits { font-weight: 700; }

/* bottom settings bar */
#settingsOverlay {
  position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 900; display: flex;
  height: 9vh; height: 9dvh; overflow: hidden; background: var(--bg);
  border-top: 1px solid var(--border2); border-radius: 0 0 32px 32px;
}
#settingsOverlay.scanning { top: 8px; height: auto; z-index: 960; border-top: 0; border-radius: 32px; }
#settingsOverlay.scanning .bar { display: none; }
.bar {
  flex: 1; min-width: 0; min-height: 0; display: grid; overflow: hidden;
  grid-template-columns: 1.4fr .9fr 2.4fr 1.4fr .9fr .9fr 1.3fr 1.2fr 1.2fr 1.3fr 1.5fr;
  grid-template-rows: 1fr 1fr; background: var(--bg); border-radius: 0 0 30px 30px;
}
.bar button {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 0; min-height: 0; padding: 0; border: 0; border-right: 1px solid rgba(0,4,50,.3); border-radius: 0;
  color: #000432; -webkit-text-fill-color: #000432; font-family: var(--mono);
  cursor: pointer; touch-action: manipulation;
}
.bar button:hover { filter: brightness(1.15); }
.bar b { max-width: 100%; font-size: clamp(10px, min(2.4vw, 2.6vh), 22px); font-weight: 500; line-height: 1; }
.b-pair { grid-area: 1/1/3/2; padding-left: 14px !important; background: #FFD700; }
.b-pair b { font-size: clamp(10px, min(2.2vw, 2.8vh), 20px); white-space: normal; word-break: break-all; text-align: center; }
.b-week { grid-area: 1/2/3/5; background: #54A0FF; }
.b-week b { font-size: clamp(9px, 2.2vw, 20px); white-space: nowrap; line-height: 1.35; text-align: center; overflow: hidden; }
.b-fh { grid-area: 1/5; background: #FF9FF3; border-bottom: 1px solid rgba(0,4,50,.3) !important; }
.b-fm { grid-area: 1/6; background: #48DBFB; border-bottom: 1px solid rgba(0,4,50,.3) !important; }
.b-th { grid-area: 2/5; background: #FF9FF3; }
.b-tm { grid-area: 2/6; background: #48DBFB; }
.b-fh::before, .b-th::before {
  position: absolute; top: 1px; left: 3px; font-size: 7px; letter-spacing: .06em; opacity: .7;
}
.b-fh::before { content: "START"; }
.b-th::before { content: "END"; }
.b-sess { grid-area: 1/7/3/8; background: #1DD1A1; }
.b-sess b { font-size: clamp(9px, 1.8vw, 18px); white-space: nowrap; line-height: 1.2; text-align: center; }
.b-cmin { grid-area: 1/8; background: #FF6B81; border-bottom: 1px solid rgba(0,4,50,.3) !important; }
.b-cmax { grid-area: 2/8; background: #2ED573; }
.b-prob { grid-area: 1/9/3/10; background: #FECA57; }
.b-cache { grid-area: 1/10/3/11; background: #FF9F43; }
.b-run { grid-area: 1/11/3/12; padding-right: 14px !important; background: #CCF5DF; border-right: 0 !important; }

/* scan view */
#scanPage { display: none; flex-direction: column; width: 100%; height: 100%; padding: 14px 12px; }
#settingsOverlay.scanning #scanPage { display: flex; }
.scan-title { flex: none; margin-bottom: 6px; font-family: var(--mono); font-size: 16px; letter-spacing: .12em; color: var(--green); }
.progress-head { display: flex; justify-content: space-between; margin-bottom: 8px; font-family: var(--mono); font-size: 15px; }
#progressLabel { color: var(--text-mid); }
#progressPct { color: var(--green); }
.progress-track { flex: none; height: 8px; border-radius: 2px; overflow: hidden; }
#progressFill { width: 0; height: 100%; background: var(--green); border-radius: 2px; transition: width .3s ease; }
#scanLog {
  flex: 1 1 0; min-height: 0; margin-top: 8px; padding: 8px 10px; overflow-y: auto;
  border: 1px solid var(--border2); border-radius: 4px;
  font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--text-mid);
}
#scanLog div { padding: 1px 0; border-bottom: 1px solid rgba(255,255,255,.05); word-break: break-word; }
#scanLog div:first-child { color: var(--green); }
.cancel-btn {
  flex: none; width: 100%; margin-top: 10px; padding: 14px 16px; background: transparent; color: var(--text-mid);
  border: 1px solid var(--border2); border-radius: 4px; font-family: var(--mono); font-size: 14px;
  letter-spacing: .05em; cursor: pointer;
}
.cancel-btn:hover { background: rgba(255,255,255,.08); }

/* popups */
#pop {
  display: none; position: fixed; inset: 0; z-index: 1200; padding: 10px;
  align-items: center; justify-content: center; background: rgba(0,2,24,.78);
}
.pop-box {
  width: min(560px, 96vw); max-height: 96vh; overflow-y: auto; padding: 12px;
  background: var(--surface); border: 1px solid var(--border2); border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.pop-title { margin-bottom: 10px; text-align: center; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--green); }
.pop-grid { display: grid; gap: 6px; }
.pop-grid.ph { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.pop-grid.pm { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.pop-grid.pd { grid-template-columns: repeat(7, minmax(0, 1fr)); }
.pop-grid.pmo, .pop-grid.pk { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pop-grid.py, .pop-grid.pp { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pop-grid.pss { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pop-btn {
  height: 48px; padding: 0; background: transparent; color: var(--text-mid);
  border: 1px solid var(--border2); border-radius: 6px;
  font-family: var(--mono); font-size: 17px; cursor: pointer; touch-action: manipulation;
}
.pm .pop-btn { height: 40px; font-size: 14px; }
.pmo .pop-btn { font-size: 13px; letter-spacing: 0; white-space: nowrap; overflow: hidden; }
.pp .pop-btn { height: 40px; font-size: 12px; }
.pss .pop-btn { height: auto; min-height: 58px; padding: 4px 2px; font-size: 14px; line-height: 1.15; }
.pop-btn:hover { border-color: var(--green); color: var(--text); }
.pop-btn.on, .pop-btn.ok { background: var(--green); border-color: var(--green); color: #000432; font-weight: 700; }
.pop-btn.dim { opacity: .28; cursor: not-allowed; }
.pop-sub { display: block; font-size: 10px; font-weight: 400; line-height: 1.3; }
.pop-dow { text-align: center; font-family: var(--mono); font-size: 12px; font-weight: 700; line-height: 24px; color: var(--text-dim); }
.pop-dow.we { color: #e58f99; }
.pop-display {
  margin-bottom: 10px; padding: 8px; text-align: center; color: var(--green);
  border: 1px solid var(--border2); border-radius: 6px; font-family: var(--mono); font-size: 36px;
}
.pop-display.small { padding: 6px; font-size: 12px; }

/* toast */
#toast {
  position: fixed; right: 24px; bottom: calc(9vh + 24px); bottom: calc(9dvh + 24px); z-index: 999;
  max-width: 340px; padding: 12px 18px; background: var(--panel); color: var(--text);
  border: 1px solid var(--border2); border-radius: 6px; font-family: var(--mono); font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
#toast.show { opacity: 1; }
#toast.err { border-color: var(--red); color: var(--red); }
#toast.ok { border-color: var(--green); color: var(--green); }
</style>
</head>
<body>

<div class="layout">
  <div class="main">
    <div class="filter-bar" id="filterBar">
      <input type="number" id="filterPct" placeholder="100" min="0" max="100">
      <select id="levelFilter">
        <option value="__ALL__" selected>ALL LEVELS</option>
        <option value="1-2">X1→X2</option>
        <option value="2-3">X2→X3</option>
        <option value="3-4">X3→X4</option>
        <option value="4-5">X4→X5</option>
        <option value="5-6">X5→X6</option>
        <option value="6-7">X6→X7</option>
        <option value="7-8">X7→X8</option>
        <option value="8-9">X8→X9</option>
        <option value="9-10">X9→X10</option>
      </select>
      <button type="button" class="export-btn" id="row0Btn" onclick="toggleRow0()">ROW 0 ONLY</button>
      <button type="button" class="export-btn on" id="lvlsBtn" onclick="toggleLvls()" title="Best % row of every level at once">LVLS</button>
      <button type="button" class="export-btn on" id="ordBtn" onclick="toggleOrd()" title="With LVLS: list levels in order X1, X2, X3...">ORD</button>
      <button type="button" class="export-btn" id="xsBtn" onclick="toggleXs()" style="display:none">BY SESSION</button>
    </div>
    <div class="table-area" id="tableArea"></div>
  </div>
</div>

<div id="settingsOverlay">
  <div class="bar" id="bar"></div>
  <div id="scanPage">
    <div class="scan-title">SCANNING…</div>
    <div class="progress-head"><span id="progressLabel">Initialising…</span><span id="progressPct">0%</span></div>
    <div class="progress-track"><div id="progressFill"></div></div>
    <div id="scanLog"></div>
    <button type="button" class="cancel-btn" id="scanCancelBtn">■ CANCEL SCAN</button>
  </div>
</div>

<div id="pop"></div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const pad2 = n => (n < 10 ? "0" : "") + n;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hm = t => { const q = ((t % 1440) + 1440) % 1440; return pad2(Math.floor(q / 60)) + ":" + pad2(q % 60); };
const fmtSess = m => m < 60 ? m + "m" : Math.floor(m / 60) + "h" + (m % 60 ? (m % 60) + "m" : "");

const WS_URL = "wss://api.derivws.com/trading/v1/options/ws/public?app_id=1089";
const IST_OFFSET = 19800;
const MONTHS = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const PAIR_GROUPS = [
  ["METALS", ["frxXAGUSD", "frxXAUUSD", "frxXPTUSD"]],
  ["FOREX", ["frxAUDCAD", "frxAUDCHF", "frxAUDJPY", "frxAUDUSD", "frxEURAUD", "frxEURCAD", "frxEURCHF", "frxEURGBP", "frxEURJPY", "frxEURUSD", "frxGBPAUD", "frxGBPCAD", "frxGBPCHF", "frxGBPJPY", "frxGBPUSD", "frxUSDCAD", "frxUSDCHF", "frxUSDJPY"]],
  ["CRYPTO", ["cryBTCUSD", "cryETHUSD"]],
  ["VOLATILITY (1s)", ["1HZ10V", "1HZ15V", "1HZ25V", "1HZ30V", "1HZ50V", "1HZ75V", "1HZ90V", "1HZ100V"]]
];
const ALL_PAIRS = PAIR_GROUPS.flatMap(g => g[1]);

function pairLabel(v) {
  const cd = v.replace(/^frx|^cry/, ""), m = cd.match(/^1HZ(\d+)V$/);
  return m ? "V" + m[1] : cd.slice(0, 3) + "/" + cd.slice(3);
}
function pairName(p) {
  const m = p.match(/^1HZ(\d+)V$/);
  return m ? "VOL " + m[1] : p.replace(/^(frx|cry)/, "");
}

// ── state ──
const cfg = { date: new Date().toISOString().slice(0, 10), week: weekMonday(new Date().toISOString().slice(0, 10)), weeks: 1, from: "10:30", to: "22:30", cmin: 132, cmax: 132, minPct: 10, sess: 12 };
let selPairs = new Set(["frxEURUSD"]);
let allPairsMode = false;
let allRevs = [], allMoms = [];
let scanRunning = false, cancelFlag = false, cacheReady = false;
let lvlsOn = true, ordOn = true, row0Only = false, xsView = false;
let last = { sessCount: 1, perDay: 1, days: [], sessMin: 0, startIST: "10:30" };
const lvlsExp = {}, lvlsCnt = {};
const tickCache = {};

function toast(msg, type = "ok", dur = 3000) {
  const el = $("toast");
  el.textContent = msg;
  el.className = "show " + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = "", dur);
}

// ── tick cache (IndexedDB) ──
const IDB_NAME = "wallspectrum_cache", IDB_STORE = "ticks";
let idbReady = null;

function idbOpen() {
  idbReady ||= new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }).catch(err => { console.warn("IndexedDB unavailable, using memory cache only", err); return null; });
  return idbReady;
}
async function idbTx(mode, fn) {
  const db = await idbOpen();
  if (!db) return;
  return new Promise(resolve => {
    try {
      const tx = db.transaction(IDB_STORE, mode);
      fn(tx.objectStore(IDB_STORE));
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    } catch { resolve(); }
  });
}
const idbSet = (k, v) => idbTx("readwrite", s => s.put(v, k));
const idbClear = () => idbTx("readwrite", s => s.clear());
async function idbGetAll() {
  const out = {};
  await idbTx("readonly", s => {
    s.openCursor().onsuccess = e => {
      const c = e.target.result;
      if (c) { out[c.key] = c.value; c.continue(); }
    };
  });
  return out;
}
async function clearPersistedCache() {
  for (const k in tickCache) delete tickCache[k];
  await idbClear();
  toast("Cache cleared", "ok");
}

// ── tick fetching ──
function fetchChunk(pair, t0, t1) {
  return new Promise(resolve => {
    const result = {};
    let ws;
    const done = () => { clearTimeout(timer); try { ws.close(); } catch {} resolve(result); };
    const timer = setTimeout(done, 25000);
    try {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => ws.send(JSON.stringify({ ticks_history: pair, start: t0, end: t1, count: 5000, style: "ticks" }));
      ws.onmessage = ev => {
        const d = JSON.parse(ev.data);
        if (d.history) for (let i = 0; i < d.history.times.length; i++) result[+d.history.times[i]] = +d.history.prices[i];
        if (d.history || d.error) done();
      };
      ws.onerror = ws.onclose = done;
    } catch { done(); }
  });
}

async function loadTicksForDay(pair, dayEpoch, secFrom, secTo, cached, logCb) {
  const start = dayEpoch + secFrom, end = dayEpoch + secTo;
  const actualEnd = Math.min(end, Math.floor(Date.now() / 1000));
  if (actualEnd < start) return [];

  const length = end - start + 1;
  const prices = new Float64Array(length).fill(-1);
  if (cached) for (let i = 0, n = Math.min(length, cached.length); i < n; i++) prices[i] = cached[i];

  const gapMin = /^(cry|1HZ)/i.test(pair) ? 120 : 900;
  const gaps = [];
  let gapStart = -1;
  for (let i = 0; i <= actualEnd - start; i++) {
    if (prices[i] === -1) {

  const WORKERS = 16;
  for (let i = 0; i < chunks.length; i += WORKERS) {

// ── streak scan (web workers) ──
function workerMain() {
  function cumulative(hist, maxS) {

      const hist = [new Array(c).fill(null), new Array(c).fill(null)];       var histO = [new Array(c).fill(null), new Array(c).fill(null)];
            const record = (row, color, s, open) => {
        const k = color === 1 ? 0 : 1;
        const h = (open ? histO : hist)[k][row] ||= {};

        if (s > maxLen[k][row]) maxLen[k][row] = s;

        else if (p < prevP) { newC = 2; newS = cont && rowColor[row] === 2 && rowStreak[row] > 0 ? rowStreak[row] + 1 : 1; }
        else { if (rowStreak[row] > 0 && rowColor[row] !== 0) record(row, rowColor[row], rowStreak[row], 1); newC = newS = 0; }

        if (prevP === -1) newC = newS = 0;
                if (newS === 1 && rowStreak[row] > 0 && rowColor[row] !== 0 && cont) record(row, rowColor[row], rowStreak[row], 0);
        rowColor[row] = newC; rowStreak[row] = newS; rowCol[row] = col;
      }
      for (let r = 0; r < c; r++) if (rowStreak[r] >= 1 && rowColor[r] !== 0) record(r, rowColor[r], rowStreak[r], 1);

      for (let r = 0; r < c; r++) {

            revs.push({ ...base, pct: 100 - Math.round(c2 / c1 * 100), type: "REV" });
            if (c1 > 1) moms.push({ ...base, pct: Math.round(c2 / c1 * 100), type: "MOM" });

}

let workerURL = null;
const getWorkerURL = () => workerURL ||= URL.createObjectURL(new Blob([`(${workerMain})()`], { type: "application/javascript" }));

function workerScan(prices, minC, maxC, pair, startTsUtc, onProgress) {
  return new Promise(resolve => {
    const total = maxC - minC + 1;
    const nWorkers = Math.min(navigator.hardwareConcurrency || 4, 16, total);
    const per = Math.ceil(total / nWorkers);
    const shards = [];
    for (let s = minC; s <= maxC; s += per) shards.push([s, Math.min(s + per - 1, maxC)]);
    const revs = [], moms = [];
    let done = 0;
    const finish = () => {
      done++;
      if (onProgress) onProgress(done / shards.length);
      if (done === shards.length) resolve([revs, moms]);
    };
    for (const [a, b] of shards) {
      const w = new Worker(getWorkerURL());
      const buf = new Float64Array(prices);
      w.onmessage = e => {
        for (const x of e.data.revs) revs.push(x);
        for (const x of e.data.moms) moms.push(x);
        w.terminate();
        finish();
      };
      w.onerror = () => { w.terminate(); finish(); };
      w.postMessage({ prices: buf, minC: a, maxC: b, pair, startTsUtc }, [buf.buffer]);
    }
  });
}

async function workerScanSessions(prices, cMin, cMax, pair, startTs, winSec, sessMin, onFrac) {
  if (!sessMin) return workerScan(prices, cMin, cMax, pair, startTs, onFrac);
  const n = Math.max(1, Math.round(winSec / (sessMin * 60)));
  const sessSec = Math.round(winSec / n);
  let merged = null;
  for (let si = 0; si < n; si++) {
    if (cancelFlag) break;
    const a = si * sessSec, b = si === n - 1 ? prices.length : (si + 1) * sessSec;
    const slice = prices.slice(a, b);
    if (slice.length <= cMax) continue;
    const r = await workerScan(slice, cMin, cMax, pair, 0, f => onFrac && onFrac((si + f) / n));
    for (const list of r) for (const it of list) it.sess = si + 1;
    merged = merged ? [merged[0].concat(r[0]), merged[1].concat(r[1])] : r;
  }
  return merged || [[], []];
}

  }

  const winSec = secTo - secFrom;

          const fetchBase = ui / units * 60, scanBase = 60 + ui / units * 28, scanSlice = 28 / units;
          const key = `${pair}|${date}|${secFrom}-${secTo}`;
  
          setProgress(fetchBase, `${tag}  syncing day`, `${pair}  ${date}  ${cfg.from}–${cfg.to} IST`);
          const prices = await loadTicksForDay(pair, dayEpoch, secFrom, secTo, tickCache[key], msg => setLog(`${tag}  ${date}  ${msg}`));

          if (!prices.length) { setLog(`${tag}  ${date}  future day, skipped`); continue; }
                  if (!prices.some(v => v !== -1)) { setLog(`${tag}  ${date}  no ticks (market closed), skipped`); continue; }

            setProgress(scanBase + f * scanSlice,

    const nRev = allRevs.filter(x => x.pct >= minPct).length;

    setProgress(100, "Complete", `Done — ${nRev} REV  |  ${nMom} MOM`);
    $("filterBar").classList.add("show");
    $("filterPct").value = minPct;

  const sessTime = s => {
      if (!last.startIST || !last.sessMin) return "";
      const per = last.perDay || cnt, di = Math.floor((s - 1) / per), si = (s - 1) % per;
      const [h, m] = last.startIST.split(":").map(Number);
      const t0 = h * 60 + m + si * last.sessMin;
      return (last.days && last.days[di] ? dayLbl(last.days[di]) + " " : "") + hm(t0) + "-" + hm(t0 + last.sessMin);
    };
  const cards = list.slice(0, 60).map((g, idx) => {
    const tl = sessTime(g.s);
    return `<div class="rank-card${idx < 3 ? " top" : ""}"><div class="rk-lbl">${idx === 0 ? "🏆 " : "#" + (idx + 1) + " "}${sessTag(g.s)}</div>` +
      (tl ? `<div class="rk-time">${tl} IST</div>` : "") +
      `<div class="rk-val">${g.win.toFixed(1)}%</div><div class="rk-sub">${g.n} signals · avg ${g.avg.toFixed(1)}%</div></div>`;
  }).join("");
  return `<div class="rank-wrap"><div class="pane-head"><span>🏆 BEST SESSION OF THE RANGE · ${cnt} sessions ranked by C1-weighted win% · top 60 shown</span><span>${list.length}</span></div>` +
    `<div class="rank-cards">${cards}</div></div>`;
}

function computeCrossSession() {
  const minPct = parseInt($("filterPct").value) || 0, lv = levelFilter();
  const build = list => {
    const groups = {};
    for (const d of list) {
      if (d.pct < minPct || !matchesLevel(d, lv) || (row0Only && d.r !== 0)) continue;
      const g = groups[d.pair + "|" + d.c + "|" + d.r + "|" + d.col + "|" + d.s1] ||= { hits: [], sum: 0 };
      g.hits.push(d);
      g.sum += d.pct;
    }
    return Object.values(groups)
      .filter(g => g.hits.length >= 2)
      .map(g => {
        g.hits.sort((a, b) => (a.sess || 1) - (b.sess || 1));
        const s = g.hits[0];
        return { pair: s.pair, col: s.col, c: s.c, r: s.r, s1: s.s1, s2: s.s2, n: g.hits.length, avg: Math.round(g.sum / g.hits.length), hits: g.hits };
      })
      .sort((a, b) => b.n - a.n || b.avg - a.avg);
  };
  return { rev: build(allRevs), mom: build(allMoms) };
}

function buildXsPane(label, list, total) {
  const rows = list.slice(0, 150).map(g => {
    const red = g.col === "R", cls = red ? "row-red" : "row-green";
    const det = g.hits.slice(0, 40).map(h => `${sessTag(h.sess || 1)}: ${h.c1}/${h.c2}`).join(" · ") + (g.hits.length > 40 ? ` · +${g.hits.length - 40} more` : "");
    return `<tr class="${cls} xs-m"><td class="cell-pair">${red ? "↓" : "↑"} ${pairName(g.pair)}</td><td>C${g.c}</td><td>R${g.r}</td>` +
      `<td>X${g.s1}→X${g.s2}</td><td class="xs-hits">${g.n}/${total}</td><td>${g.avg}%</td></tr>` +
      `<tr class="${cls} xs-d"><td colspan="6">${det}</td></tr>`;
  }).join("");
  const cols = "<colgroup>" + [28, 13, 12, 19, 15, 13].map(w => `<col style="width:${w}%">`).join("") + "</colgroup>";
  const body = rows
    ? `<table class="xs-t">${cols}<thead><tr><th>PAIR</th><th>CYC</th><th>ROW</th><th>STREAK</th><th>HITS</th><th>AVG%</th></tr></thead><tbody>${rows}</tbody></table>`
    : '<div class="state-empty">No wall repeats in 2+ sessions</div>';
  return `<div class="xs-pane"><div class="xs-head"><span>${label} · S: C1/C2 PER SESSION</span><span>${list.length}</span></div>${body}</div>`;
}

function buildXsHTML() {
  const total = last.sessCount, x = computeCrossSession();
  return `<div class="xs-wrap"><div class="xs-head"><span>DATASETS ${total}</span>` +
    `<button type="button" class="export-btn" onclick="exportXsCSV()">⬇ EXPORT CSV (${x.rev.length + x.mom.length})</button></div>` +
    buildXsPane("REVERSAL", x.rev, total) + buildXsPane("MOMENTUM", x.mom, total) + "</div>";
}

function renderTable() {
  $("lvlsBtn").classList.toggle("on", lvlsOn);
  $("ordBtn").classList.toggle("on", ordOn);
  $("row0Btn").classList.toggle("on", row0Only);
  if (lvlsOn) $("levelFilter").value = "__ALL__";
  $("levelFilter").disabled = $("filterPct").disabled = lvlsOn;

  const minPct = parseInt($("filterPct").value) || 0, lv = levelFilter();
  const filterFn = x => x.pct >= minPct && matchesLevel(x, lv) && (!row0Only || x.r === 0);
  const sortFn = (a, b) => b.pct * b.c1 - a.pct * a.c1;
  const rev = lvlsOn ? lvlsBuild(allRevs) : allRevs.filter(filterFn).sort(sortFn).slice(0, 100);
  const mom = lvlsOn ? lvlsBuild(allMoms) : allMoms.filter(filterFn).sort(sortFn).slice(0, 100);

  const area = $("tableArea"), rank = buildSessionRankHTML(filterFn);
  if (xsView && last.sessCount > 1) { area.innerHTML = rank + buildXsHTML(); return; }
  if (!rev.length && !mom.length) {
    area.innerHTML = rank + '<div class="state-empty"><div style="font-size:36px">○</div><div>No signals at current filters</div><div>Try lowering Min % or adjusting filters</div></div>';
    return;
  }
  area.innerHTML = rank + `<div class="split-table-wrap">${buildPane("REVERSAL", rev)}${buildPane("MOMENTUM", mom)}</div>`;
}

$("filterPct").addEventListener("input", renderTable);
$("levelFilter").addEventListener("change", renderTable);

// ── CSV export (session repeats) ──
async function downloadCSV(csv, filename) {
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: filename, types: [{ description: "CSV File", accept: { "text/csv": [".csv"] } }] });
      const w = await handle.createWritable();
      await w.write(csv);
      await w.close();
    } catch (e) {
      if (e.name !== "AbortError") toast("Save failed: " + e.message, "err");
    }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 3000);
  } catch (e) {
    toast("Download failed: " + e.message, "err");
  }
}

async function exportXsCSV() {
  const x = computeCrossSession(), total = last.sessCount, rows = [];
  for (const [type, list] of [["REV", x.rev], ["MOM", x.mom]]) {
    for (const g of list) {
      const det = g.hits.map(h => `${sessTag(h.sess || 1).replace(/ /g, "_")}:${h.c1}/${h.c2}`).join("|");
      rows.push([type, pairName(g.pair), g.col === "R" ? "BEARISH" : "BULLISH", g.c, g.r, g.s1, g.s2, g.n, total, g.avg, det].join(","));
    }
  }
  if (!rows.length) { toast("No session repeats to export", "err"); return; }
  const headers = "TYPE,PAIR,DIRECTION,CYCLE,ROW,STREAK_FROM,STREAK_TO,HITS,DATASETS,AVG_PROB_%,DETAIL_SESSION:C1/C2";
  await downloadCSV([headers, ...rows].join("\n"), `wallspectrum_session_repeats_week_${(last.days && last.days[0]) || new Date().toISOString().slice(0, 10)}.csv`);
  toast(`Exported ${rows.length} session repeat(s) to CSV`, "ok");
}

// ── settings bar + popups ──
function closePop() { $("pop").style.display = "none"; renderBar(); }
function showPop(html, onClick) {
  const pop = $("pop");
  pop.innerHTML = html;
  pop.onclick = ev => ev.target === pop ? closePop() : onClick(ev);
  pop.style.display = "flex";
}

function valuePopup(title, count, start, cur, cls, onPick, dow = 0) {
  let h = `<div class="pop-box"><div class="pop-title">${title}</div><div class="pop-grid ${cls}">`;
  if (cls === "pd") {
    h += [..."MTWTFSS"].map((d, i) => `<span class="pop-dow${i >= 5 ? " we" : ""}">${d}</span>`).join("") + "<span></span>".repeat(dow);
  }
  for (let q = 0; q < count; q++) {
    const v = start + q;
    const lbl = cls === "py" ? v : cls === "pmo" ? MONTHS[v - 1] : pad2(v);
    h += `<button type="button" data-v="${v}" class="pop-btn${v === cur ? " on" : ""}">${lbl}</button>`;
  }
  showPop(h + "</div></div>", ev => {
    const b = ev.target.closest(".pop-btn");
    if (!b) return;
    onPick(+b.dataset.v);
    closePop();
  });
}

function keypad(title, key, min, max) {
  let buf = String(cfg[key]), fresh = true;
  const draw = () => showPop(
    `<div class="pop-box"><div class="pop-title">${title}</div><div class="pop-display">${buf || "0"}${key === "minPct" ? "%" : ""}</div><div class="pop-grid pk">` +
    [1, 2, 3, 4, 5, 6, 7, 8, 9].map(q => `<button type="button" data-k="${q}" class="pop-btn">${q}</button>`).join("") +
    '<button type="button" data-k="b" class="pop-btn">&#9003;</button><button type="button" data-k="0" class="pop-btn">0</button><button type="button" data-k="ok" class="pop-btn ok">OK</button></div></div>',
    ev => {
      const b = ev.target.closest(".pop-btn");
      if (!b) return;
      const k = b.dataset.k;
      if (k === "ok") {
        const n = parseInt(buf, 10);
        cfg[key] = Math.max(min, Math.min(max, isNaN(n) ? min : n));
        closePop();
        return;
      }
      if (k === "b") { buf = buf.slice(0, -1); fresh = false; }
      else {
        if (fresh) { buf = ""; fresh = false; }
        if (buf.length < 3) buf += k;
      }
      draw();
    });
  draw();
}

function togglePair(v) {
  if (v === "__ALL__") {
    allPairsMode = !allPairsMode;
    selPairs.clear();
    return;
  }
  if (allPairsMode) { allPairsMode = false; selPairs = new Set([v]); return; }
  if (!selPairs.delete(v)) selPairs.add(v);
  if (!selPairs.size) allPairsMode = true;
}

function pairText() {
  if (allPairsMode) return "ALL";
  const chosen = ALL_PAIRS.filter(p => selPairs.has(p));
  return !chosen.length ? "-" : chosen.length === 1 ? pairLabel(chosen[0]) : chosen.length + " PAIRS";
}

function pairPopup() {
  const pop = $("pop");
  const draw = () => {
    const keep = pop.querySelector(".pop-box")?.scrollTop || 0;
    pop.innerHTML = '<div class="pop-box"><div class="pop-title">PAIRS</div><div class="pop-grid pp">' +
      ["__ALL__", ...ALL_PAIRS].map(v => {
        const all = v === "__ALL__", on = all ? allPairsMode : allPairsMode || selPairs.has(v);
        return `<button type="button" data-v="${v}" class="pop-btn${on ? " on" : ""}">${all ? "ALL" : pairLabel(v)}</button>`;
      }).join("") + "</div></div>";
    pop.querySelector(".pop-box").scrollTop = keep;
  };
  pop.onclick = ev => {
    if (ev.target === pop) { closePop(); return; }
    const b = ev.target.closest(".pop-btn");
    if (!b) return;
    togglePair(b.dataset.v);
    draw();
    renderBar();
  };
  draw();
  pop.style.display = "flex";
}

function winMinutes() {
  const [a, b] = ["from", "to"].map(k => { const [h, m] = cfg[k].split(":").map(Number); return h * 60 + m; });
  return a === b ? 1440 : (b < a ? b + 1440 : b) - a;
}

function sessionPopup() {
  const N = winMinutes(), cur = cfg.sess || N;
  const [sh, sm] = cfg.from.split(":").map(Number), st = sh * 60 + sm;
  let h = `<div class="pop-box"><div class="pop-title">SESSION - ${hm(st)}-${hm(st + N)} (${fmtSess(N)})</div>` +
    `<div class="pop-display small">CYCLE MAX C${cfg.cmax} - SESSION MUST BE LONGER (DIMMED = TOO SHORT)</div><div class="pop-grid pss">`;
  for (let d = 1; d <= N; d++) {
    if (N % d) continue;
    const ok = d * 60 > cfg.cmax, cnt = N / d, slot = i => hm(st + i * d) + "-" + hm(st + (i + 1) * d);
    const tl = cnt <= 4
      ? Array.from({ length: cnt }, (_, i) => slot(i)).join("<br>")
      : slot(0) + "<br>...<br>" + slot(cnt - 1);
    h += `<button type="button" data-d="${d}" data-ok="${ok ? 1 : 0}" class="pop-btn${d === cur ? " on" : ""}${ok ? "" : " dim"}">${fmtSess(d)} &times;${cnt}<br><span class="pop-sub">${tl}</span></button>`;
  }
  showPop(h + "</div></div>", ev => {
    const b = ev.target.closest(".pop-btn");
    if (!b || b.dataset.ok !== "1") return;
    const d = +b.dataset.d;
    cfg.sess = d === N ? 0 : d;
    closePop();
  });
}

const dateParts = () => { const [y, m, d] = cfg.date.split("-").map(Number); return { y, m, d }; };
const DOW3 = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
function weekMonday(ds) {
  const t = new Date(ds + "T00:00:00Z");
  t.setUTCDate(t.getUTCDate() - (t.getUTCDay() + 6) % 7);
  return t.toISOString().slice(0, 10);
}
function weekDays(mon) {
  return Array.from({ length: 5 }, (_, i) => {
    const t = new Date(mon + "T00:00:00Z");
    t.setUTCDate(t.getUTCDate() + i);
    return t.toISOString().slice(0, 10);
  });
}
function dayLbl(ds) { return pad2(+ds.slice(8, 10)) + " " + MONTHS[+ds.slice(5, 7) - 1].slice(0, 3); }
function rangeStart() {
  const t = new Date(cfg.week + "T00:00:00Z");
  t.setUTCDate(t.getUTCDate() - 7 * ((cfg.weeks || 1) - 1));
  return t.toISOString().slice(0, 10);
}
function rangeDays() {
  const s = rangeStart(), out = [];
  for (let w = 0; w < (cfg.weeks || 1); w++) {
    const t = new Date(s + "T00:00:00Z");
    t.setUTCDate(t.getUTCDate() + 7 * w);
    out.push(...weekDays(t.toISOString().slice(0, 10)));
  }
  return out;
}
function weekText() {
  const a = weekDays(rangeStart())[0], b = weekDays(cfg.week)[4];
  return dayLbl(a) + " – " + dayLbl(b) + "<br>" + b.slice(0, 4) + " · " + (cfg.weeks || 1) * 5 + "D";
}
function sessTag(s) {
  const per = last.perDay || 1, di = Math.floor((s - 1) / per), si = (s - 1) % per, dd = last.days && last.days[di];
  return (dd ? DOW3[new Date(dd + "T00:00:00Z").getUTCDay()] + " " + dayLbl(dd) + " " : "") + "S" + (si + 1);
}
function weekPopup() {
  const handler = ev => {
    const b = ev.target.closest(".pop-btn");
    if (!b) return;
    if (b.dataset.n) { cfg.weeks = +b.dataset.n; draw(); return; }
    cfg.week = b.dataset.w;
    closePop();
  };
  const draw = () => {
    const keep = $("pop").querySelector(".pop-box")?.scrollTop || 0;
    const t = new Date(weekMonday(new Date().toISOString().slice(0, 10)) + "T00:00:00Z");
    let h = '<div class="pop-box"><div class="pop-title">RANGE LENGTH - MON-FRI ONLY</div><div class="pop-grid pp">';
    for (const [n, lbl] of [[1, "1 WEEK"], [2, "2 WEEKS"], [4, "1 MONTH"], [8, "2 MONTHS"], [13, "3 MONTHS"], [26, "6 MONTHS"], [39, "9 MONTHS"], [52, "1 YEAR"]]) {
      h += `<button type="button" data-n="${n}" class="pop-btn${n === cfg.weeks ? " on" : ""}">${lbl}</button>`;
    }
    h += '</div><div class="pop-title" style="margin-top:12px">LAST WEEK OF THE RANGE</div><div class="pop-grid pss">';
    for (let i = 0; i < 80; i++) {
      const w = t.toISOString().slice(0, 10), d = weekDays(w);
      h += `<button type="button" data-w="${w}" class="pop-btn${w === cfg.week ? " on" : ""}">${dayLbl(d[0])} – ${dayLbl(d[4])}<br><span class="pop-sub">${d[4].slice(0, 4)}</span></button>`;
      t.setUTCDate(t.getUTCDate() - 7);
    }
    showPop(h + "</div></div>", handler);
    const bx = $("pop").querySelector(".pop-box");
    if (bx) bx.scrollTop = keep;
  };
  draw();
}
const timeParts = k => { const [h, n] = cfg[k].split(":").map(Number); return { h: h || 0, n: n || 0 }; };
const setTime = (k, h, n) => { cfg[k] = pad2(h) + ":" + pad2(n); };
const setDate = (y, m, d) => {
  const dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  cfg.date = y + "-" + pad2(m) + "-" + pad2(Math.min(d, dim));
};
const timePopup = (key, label, hour) => {
  const t = timeParts(key);
  if (hour) valuePopup(`${label} - HOUR`, 24, 0, t.h, "ph", v => setTime(key, v, t.n));
  else valuePopup(`${label} - MINUTE`, 60, 0, t.n, "pm", v => setTime(key, t.h, v));
};

const ACTIONS = {
  pair: pairPopup,
  week: weekPopup,
  fh: () => timePopup("from", "FROM", true),
  fm: () => timePopup("from", "FROM", false),
  th: () => timePopup("to", "TO", true),
  tm: () => timePopup("to", "TO", false),
  sess: sessionPopup,
  cmin: () => keypad("CYC MIN", "cmin", 1, 500),
  cmax: () => keypad("CYC MAX", "cmax", 1, 500),
  prob: () => keypad("MIN PROB %", "minPct", 0, 100),
  cache: clearPersistedCache,
  run: startScan
};

function renderBar() {
  const d = dateParts(), f = timeParts("from"), t = timeParts("to"), N = winMinutes();
  if (cfg.sess && (cfg.sess >= N || N % cfg.sess !== 0)) cfg.sess = 0;
  const cell = (cls, act, txt) => `<button type="button" class="b-${cls}" data-act="${act}"><b>${txt}</b></button>`;
  $("bar").innerHTML =
    cell("pair", "pair", pairText()) + cell("week", "week", weekText()) +
    cell("fh", "fh", pad2(f.h)) + cell("fm", "fm", pad2(f.n)) + cell("th", "th", pad2(t.h)) + cell("tm", "tm", pad2(t.n)) +
    cell("sess", "sess", fmtSess(cfg.sess || N)) + cell("cmin", "cmin", cfg.cmin) + cell("cmax", "cmax", cfg.cmax) +
    cell("prob", "prob", cfg.minPct + "%") + cell("cache", "cache", "&#9003;") + cell("run", "run", "&#9654;");
}

$("bar").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) ACTIONS[b.dataset.act]?.();
});
$("scanCancelBtn").addEventListener("click", () => { if (scanRunning) cancelFlag = true; });

// ── init ──
renderBar();
(async () => {
  try {
    const stored = await idbGetAll(), keys = Object.keys(stored);
    Object.assign(tickCache, stored);
    if (keys.length) toast(`Restored ${keys.length} cached day(s) from disk`, "ok", 2500);
  } catch (e) {
    console.warn("Failed to restore tick cache from IndexedDB", e);
  }
  cacheReady = true;
})();
